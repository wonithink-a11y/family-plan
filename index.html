}
async function asCreatePrep(date,text){
  const id=newId(); await prepsCol().doc(id).set({id,date,text:(text||'').slice(0,60),ts:Date.now(),by:getDeviceId(),done:false}); return id;
}
async function asExecPending(){
  const p=A.pending; if(!p)return{ok:false,say:'확인할 내용이 없어요.'};
  const x=p.payload; let say='';
  if(p.kind==='add_assessment'){await asCreateAssess(x.subject,x.date,x.content,x.score); say=x.subject+' 수행평가를 '+asDateKo(x.date)+' 마감으로 등록했어요.';}
  else if(p.kind==='add_prep'){await asCreatePrep(x.date,x.text); say=asDateKo(x.date)+' 준비물로 '+x.text+'을(를) 요청했어요.';}
  else if(p.kind==='add_event'){
    const ev={id:uid(),title:x.title,startDate:x.date,endDate:x.date,date:x.date,allDay:!x.time,startTime:x.time||'',endTime:'',category:'일반',person:x.person||'',color:x.color||'#FF6B8A',memo:'',createdAt:Date.now()};
    S.events=[ev,...S.events]; render(); await saveEventFS(ev);
    say=(x.person||'온 가족')+' 일정으로 '+asDateKo(x.date)+(x.time?' '+asTimeKo(x.time):'')+' '+x.title+'을(를) 등록했어요.';
  }else if(p.kind==='reschedule'){
    const it=S.items.find(i=>i.id===x.id); if(!it)return{ok:false,say:'그 수행평가를 찾지 못했어요.'};
    const u={...it,dueDate:x.date}; S.items=S.items.map(i=>i.id!==u.id?i:u); render(); await saveItemFS(u);
    say=it.subject+' 수행평가 마감을 '+asDateKo(x.date)+'로 바꿨어요.';
  }else if(p.kind==='done'){
    const it=S.items.find(i=>i.id===x.id); if(!it)return{ok:false,say:'그 수행평가를 찾지 못했어요.'};
    const u={...it,tasks:(it.tasks||[]).map(t=>({...t,done:true}))}; S.items=S.items.map(i=>i.id!==u.id?i:u); render(); await saveItemFS(u);
    say=it.subject+' 수행평가를 완료로 표시했어요.';
  }
  A.pending=null; return{ok:true,say};
}
async function asConfirmPending(byUser){
  const p=A.pending; if(!p)return{ok:false,say:'확인을 기다리는 내용이 없어요.'};
  if(!byUser){
    if(!(p.turn<A.turn))return{ok:false,say:'아직 사용자에게 확인을 받지 못했어요. 먼저 내용을 되묻고 답을 기다리세요.'};
    if(!asIsYes(A.lastUser))return{ok:false,say:'사용자의 마지막 말이 동의가 아니에요. 사용자가 네/응 이라고 답한 뒤에만 실행할 수 있어요.'};
  }
  try{return await asExecPending();}
  catch(e){return{ok:false,say:'저장하지 못했어요. 인터넷 연결을 확인해 주세요. ('+(e.code||e.message||e)+')'};}
}

}
async function asTool(name,a){
  a=a||{}; const now=new Date(), td=todayStr(), tm=asYmd(asAddDays(now,1));
  const fa=x=>({subject:x.subject,date:x.date,daysLeft:x.d,done:x.done,remaining:x.left||undefined});

async function asGemCall(body){
  const k=geminiKey(); if(!k)throw new Error('Gemini 키가 필요해요. 설정에서 넣어 주세요.');
  const models=['gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash']; let saved=''; try{saved=localStorage.getItem('fp_gem_model')||'';}catch(e){}
  const i=models.indexOf(saved); if(i>0)models.unshift(models.splice(i,1)[0]);
  let last='';
  for(const m of models){
    const b=Object.assign({},body,{generationConfig:Object.assign({temperature:0.5,maxOutputTokens:700},/2\.5/.test(m)?{thinkingConfig:{thinkingBudget:0}}:{})});
    let res; try{res=await asFetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(b)},30000);}
    catch(e){throw new Error('네트워크 오류예요. 인터넷 연결을 확인해 주세요.');}
    if(res.status===401||res.status===403)throw new Error('Gemini 키가 올바르지 않거나 권한이 없어요 ('+res.status+').');
    if(res.status===429)throw new Error('Gemini 사용량 한도에 걸렸어요. 잠시 뒤에 다시 해 보세요.');
    if(res.status===404){last=m+' 모델 없음';continue;}
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error((e.error&&e.error.message)||'Gemini 오류 '+res.status);}
    try{localStorage.setItem('fp_gem_model',m);}catch(e){}
    return res.json();
  }
  throw new Error(last||'Gemini 모델을 찾지 못했어요.');
}
const asClip=t=>(t||'').replace(/[*#`_>]/g,'').replace(/\n{3,}/g,'\n\n').trim();
async function asAgentTurn(text){
  A.turn++; A.lastUser=text; A.replyVoice=null;
  if(A.pending){
    if(A.pending.turn<A.turn&&asIsYes(text)){const r=await asConfirmPending(true);asHistPush(text,r.say);return r.say;}
    if(asIsNo(text)){A.pending=null;asRenderSoft();const s='알겠어요, 취소했어요.';asHistPush(text,s);return s;}
  }
  A.hist.push({role:'user',parts:[{text}]});
  for(let n=0;n<6;n++){
    const d=await asGemCall({systemInstruction:{parts:[{text:asSys(false)}]},contents:A.hist,tools:[{functionDeclarations:AS_TOOLS}]});
    const cand=d.candidates&&d.candidates[0], parts=(cand&&cand.content&&cand.content.parts)||[];
    const calls=parts.filter(p=>p.functionCall);
    A.hist.push({role:'model',parts:parts.length?parts:[{text:'네.'}]});
    if(!calls.length){
      const out=asClip(parts.map(p=>p.text||'').join(''));
      if(!out)return '답을 만들지 못했어요. 다시 말씀해 주시겠어요?';
      asHistTrim(); return out;
    }
    const resp=[];
    for(const c of calls){
      let r; try{r=await asTool(c.functionCall.name,c.functionCall.args||{});}catch(e){r={error:String(e.message||e)};}
      resp.push({functionResponse:{name:c.functionCall.name,response:{result:r}}});
    }
    A.hist.push({role:'user',parts:resp});
  }
  return '요청을 끝까지 처리하지 못했어요. 한 번만 다시 말씀해 주세요.';
}
function asHistPush(u,m){A.hist.push({role:'user',parts:[{text:u}]},{role:'model',parts:[{text:m}]});asHistTrim();}
function asHistTrim(){
  // 오래된 기록은 버리되, 항상 "사용자 말(텍스트)"로 시작하게 자른다
  while(A.hist.length>24){A.hist.shift();}
  while(A.hist.length&&!(A.hist[0].role==='user'&&A.hist[0].parts.some(p=>p.text!==undefined)))A.hist.shift();
}

/* ── 말 듣기(한 번) ── */
let _hearRes=null;
function asHear(){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){res({err:'unsupported'});return;}
    asStopSpeak(); asStopListen();
    const r=new SR(); _rec=r; r.lang='ko-KR'; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    const K=asSrKeep(r); let fin='',err='',done=false; const finish=o=>{if(done)return;done=true;_hearRes=null;A.listening=false;A.interim='';_rec=null;res(o);};
    _hearRes=()=>finish({err:'aborted'});
    r.onstart=()=>{if(!A.listening){A.listening=true;A.stat='listening';A.interim='';asRenderSoft();} if(!K.t)K.arm();};
    r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=s;else it+=s;}A.interim=(fin+it).trim();asRenderStat();K.touch();};
    r.onerror=e=>{err=(e.error==='aborted'||(K.heard&&e.error==='no-speech'))?'':e.error;};
    r.onend=()=>{ if(!done&&!err&&K.again())return; finish({text:(fin||A.interim||'').trim(),err}); };
    try{r.start();}catch(e){finish({err:'start-failed'});}
  });
}

let _convRun=false;
function asMsg(r,t){A.msgs.push({r,t});if(A.msgs.length>60)A.msgs.shift();}
async function asChatSend(text,voice){
  text=(text||'').trim(); if(!text||A.busy)return;
  asMsg('u',text); A.err='';
  if(AS_END.test(text)&&!A.pending&&text.length<=14){
    const bye='네, 다음에 또 불러 주세요.'; asMsg('a',bye); A.conv=false; A.stat=voice?'speaking':''; asRenderSoft();
    if(voice)await asSpeak(bye); A.stat=''; asRenderSoft(); return;
  }
  A.busy=true; A.stat='thinking'; asRenderSoft();
  let reply='';
  try{reply=await asAgentTurn(text);}catch(e){A.err=e.message||String(e);A.busy=false;A.stat='';A.conv=false;asRenderSoft();return;}
  A.busy=false; asMsg('a',reply); A.answer=reply;
  if(voice||A.conv){A.stat='speaking';asRenderSoft();const mv=asCfg().multiVoice!==false&&A.replyVoice?mbById(A.replyVoice):null;await asSpeak(reply,mv?mv.voice:undefined,mv?mv.pitch:undefined);}
  A.stat=''; asRenderSoft();
}
async function asConvStart(){
  if(_convRun){return;} _convRun=true; A.conv=true; A.noSpeech=0; A.err=''; asRenderSoft();
  try{
    while(A.conv&&A.open&&A.mode==='chat'){
      const h=await asHear();
      if(!A.conv||!A.open||A.mode!=='chat')break;
      if(h.err==='unsupported'){A.err='이 브라우저는 음성 인식을 지원하지 않아요. 아래 칸에 글자로 입력해 주세요.';break;}
      const fatal={'not-allowed':'마이크 사용이 막혀 있어요. 주소창의 자물쇠 → 마이크 허용으로 바꿔 주세요.','service-not-allowed':'마이크 사용이 막혀 있어요. 브라우저 설정에서 허용해 주세요.','audio-capture':'마이크를 찾을 수 없어요.','network':'음성 인식은 인터넷이 필요해요. 연결을 확인해 주세요.','start-failed':'음성 인식을 시작하지 못했어요.'};
      if(h.err&&fatal[h.err]){A.err=fatal[h.err];break;}
      if(!h.text){
        if(++A.noSpeech>=2){asMsg('s','말씀이 없어서 대화를 잠시 멈출게요. 마이크를 누르면 다시 이어가요.');break;}
        continue;

      A.noSpeech=0; await asChatSend(h.text,true);

}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   루미 2단계: Gemini Live 실시간 음성 대화 (베타)
   - WebSocket(BidiGenerateContent)으로 마이크 소리(16kHz PCM)를 계속 보내고, 답 소리(24kHz PCM)를 바로 재생한다.
   - 말을 끊으면(interrupted) 재생을 즉시 멈춘다. 같은 도구(AS_TOOLS)를 쓰고, 쓰기는 똑같이 "확인 후 실행".
   - 모델 이름·설정 모양은 아직 바뀌는 중이라, 여러 조합을 차례로 시도하고 성공한 조합을 기억한다.
   - 키가 주소의 쿼리(?key=)로 전달되는 방식이라 이 기기에서만, 가족끼리 쓰는 용도로 둔다 (HANDOVER 참고).
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const LV_MODELS=['gemini-3.8-live','gemini-3.1-flash-live-preview','gemini-2.5-flash-native-audio-preview-12-2025'];
const LV={mute:false,ws:null,stream:null,mctx:null,node:null,msrc:null,buf:[],playT:0,srcs:[],ok:false,closing:false,setupDone:null};
const asLiveState=()=>A.live||(A.live={status:'idle',lines:[],curU:'',curM:'',newU:true,err:'',model:'',speaking:false});

function lvAttempts(){
  const c=asCfg(); let saved=null; try{saved=JSON.parse(localStorage.getItem('fp_live_ok')||'null');}catch(e){}
  const models=(c.liveModel||'').trim()?[c.liveModel.trim()]:LV_MODELS.slice();
  const list=[]; models.forEach(m=>['flat','nested'].forEach(s=>list.push({m,s})));
  if(saved){const i=list.findIndex(x=>x.m===saved.m&&x.s===saved.s); if(i>0)list.unshift(list.splice(i,1)[0]);}
  return list;
}
function lvSetupMsg(att){
  const speech={voiceConfig:{prebuiltVoiceConfig:{voiceName:asCfg().voice||'Kore'}}};
  const setup={model:'models/'+att.m,systemInstruction:{parts:[{text:asSys(true)}]},tools:[{functionDeclarations:AS_TOOLS}],inputAudioTranscription:{},outputAudioTranscription:{}};
  if(att.s==='flat'){setup.responseModalities=['AUDIO'];setup.speechConfig=speech;}
  else setup.generationConfig={responseModalities:['AUDIO'],speechConfig:speech};
  return{setup};
}
function lvB64ToI16(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Int16Array(u.buffer,0,Math.floor(u.length/2));}
function lvI16ToB64(a){const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}

/* 마이크 → 16kHz PCM16 */
async function lvMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('이 브라우저는 마이크를 지원하지 않아요.');
  try{LV.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});}
  catch(e){throw new Error(e&&e.name==='NotAllowedError'?'마이크 사용이 막혀 있어요. 주소창의 자물쇠 → 마이크 허용으로 바꿔 주세요.':'마이크를 열지 못했어요.');}
  const AC=window.AudioContext||window.webkitAudioContext; LV.mctx=new AC(); const inRate=LV.mctx.sampleRate;
  LV.msrc=LV.mctx.createMediaStreamSource(LV.stream); LV.buf=[]; let acc=[],accLen=0;
  const flush=()=>{
    const n=accLen; if(n<inRate/10)return; const all=new Float32Array(n); let o=0; acc.forEach(c=>{all.set(c,o);o+=c.length;}); acc=[];accLen=0;
    const ratio=inRate/16000, outN=Math.floor(n/ratio), out=new Int16Array(outN);
    for(let i=0;i<outN;i++){const a=Math.floor(i*ratio),b=Math.min(n,Math.floor((i+1)*ratio));let s=0;for(let j=a;j<b;j++)s+=all[j];const v=s/Math.max(1,b-a);out[i]=Math.max(-1,Math.min(1,v))*32767;}
    lvSend({realtimeInput:{audio:{data:lvI16ToB64(out),mimeType:'audio/pcm;rate=16000'}}});
  };
  const onBlock=f=>{acc.push(f);accLen+=f.length;flush();};
  let worklet=false;
  if(LV.mctx.audioWorklet){
    try{
      const code="class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true;}}registerProcessor('lm-cap',P);";
      const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
      await LV.mctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
      const n=new AudioWorkletNode(LV.mctx,'lm-cap'); n.port.onmessage=e=>onBlock(e.data); LV.msrc.connect(n); n.connect(LV.mctx.destination); LV.node=n; worklet=true;
    }catch(e){worklet=false;}
  }
  if(!worklet){
    const sp=LV.mctx.createScriptProcessor(4096,1,1); sp.onaudioprocess=e=>onBlock(new Float32Array(e.inputBuffer.getChannelData(0)));
    LV.msrc.connect(sp); sp.connect(LV.mctx.destination); LV.node=sp;
  }
}
function lvSend(o){try{if(LV.ws&&LV.ws.readyState===1&&LV.ok)LV.ws.send(JSON.stringify(o));}catch(e){}}

/* 답 소리 재생 (24kHz PCM, 끊김 없이 이어 붙임) */
function lvPlay(b64){
  if(LV.mute||!_ac)return; if(_ac.state==='suspended')_ac.resume();
  const pcm=lvB64ToI16(b64); if(!pcm.length)return;
  const buf=_ac.createBuffer(1,pcm.length,24000), ch=buf.getChannelData(0); for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;
  const sp=asSpeed(); const src=_ac.createBufferSource(); src.buffer=buf; src.playbackRate.value=sp; src.connect(_ac.destination);
  const t=Math.max(_ac.currentTime+0.03,LV.playT); src.start(t); LV.playT=t+buf.duration/sp; LV.srcs.push(src);
  const L=asLiveState(); L.speaking=true;
  src.onended=()=>{LV.srcs=LV.srcs.filter(x=>x!==src); if(!LV.srcs.length){L.speaking=false;asLiveStat();}};
  asLiveStat();
}
// 사용자가 '말 멈추기'를 누르면 지금 재생 중인 소리를 끊고, 같은 답의 남은 소리는 새 말이 시작될 때까지 버린다
function lvStopSpeech(){LV.mute=true;lvFlush();}
function lvFlush(){LV.srcs.forEach(s=>{try{s.onended=null;s.stop();}catch(e){}});LV.srcs=[];LV.playT=0;asLiveState().speaking=false;asLiveStat();}

/* 서버 메시지 */
async function lvOnMsg(ev){
  let txt=ev.data; if(typeof txt!=='string'){try{txt=await (txt.text?txt.text():new Response(txt).text());}catch(e){return;}}
  let m; try{m=JSON.parse(txt);}catch(e){return;}
  const L=asLiveState();
  if(m.setupComplete!==undefined){LV.ok=true;if(LV.setupDone){LV.setupDone();LV.setupDone=null;}return;}
  const sc=m.serverContent;
  if(sc){
    if(sc.interrupted){LV.mute=false;lvFlush();}
    const parts=(sc.modelTurn&&sc.modelTurn.parts)||[];
    parts.forEach(p=>{const d=p.inlineData||p.inline_data; if(d&&d.data)lvPlay(d.data);});
    if(sc.inputTranscription&&sc.inputTranscription.text){
      LV.mute=false;
      if(L.newU){L.curU='';L.newU=false;}
      L.curU+=sc.inputTranscription.text; A.lastUser=L.curU.trim(); asLiveRender();
    }
    if(sc.outputTranscription&&sc.outputTranscription.text){
      if(L.curU.trim()){L.lines.push({r:'u',t:L.curU.trim()});L.curU='';}
      L.curM+=sc.outputTranscription.text; asLiveRender();
    }
    if(sc.turnComplete){
      LV.mute=false;
      if(L.curU.trim()){L.lines.push({r:'u',t:L.curU.trim()});L.curU='';}
      if(L.curM.trim()){L.lines.push({r:'a',t:L.curM.trim()});L.curM='';}
      L.newU=true; A.turn++; if(L.lines.length>20)L.lines.splice(0,L.lines.length-20); asLiveRender();
    }
  }
  const tc=m.toolCall;
  if(tc&&tc.functionCalls){
    const rs=[];
    for(const c of tc.functionCalls){
      let r; try{r=await asTool(c.name,c.args||{});}catch(e){r={error:String(e.message||e)};}
      rs.push({id:c.id,name:c.name,response:{result:r}});
    }
    lvSend({toolResponse:{functionResponses:rs}}); asLiveRender();
  }
  if(m.toolCallCancellation){/* 취소된 호출: 별도 처리 없음 */}
}
function lvConnect(att){
  return new Promise((res,rej)=>{
    let settled=false, ws;
    const fail=e=>{if(settled)return;settled=true;try{ws&&ws.close();}catch(x){}rej(e);};
    const timer=setTimeout(()=>fail(new Error('응답이 없어요 ('+att.m+')')),9000);
    try{ws=new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+encodeURIComponent(geminiKey()));}
    catch(e){clearTimeout(timer);rej(new Error('연결을 만들지 못했어요.'));return;}
    LV.ws=ws; LV.ok=false;
    LV.setupDone=()=>{if(settled)return;settled=true;clearTimeout(timer);res();};
    ws.onopen=()=>{try{ws.send(JSON.stringify(lvSetupMsg(att)));}catch(e){fail(e);}};
    ws.onmessage=lvOnMsg;
    ws.onerror=()=>{};
    ws.onclose=ev=>{
      clearTimeout(timer);
      if(!settled){fail(new Error((ev.reason||'연결이 닫혔어요')+' ('+ev.code+', '+att.m+')'));return;}
      if(!LV.closing)asLiveEnded(ev.reason||'연결이 끝났어요.');
    };
  });
}

/* 시작 · 종료 */
async function asLiveStart(){
  asUnlock(); const k=geminiKey();
  if(!k){A.err='실시간 대화에는 Gemini 키가 필요해요.';asRenderSoft();return;}
  asConvStop(); asStopSpeak(); lvTeardown();
  const L=A.live={status:'connecting',lines:[],curU:'',curM:'',newU:true,err:'',model:'',speaking:false};
  A.mode='live'; A.pending=null; A.open=true; asRender();
  try{await lvMic();}catch(e){L.status='error';L.err=e.message;asRender();return;}
  const tried=[]; LV.closing=false;
  for(const att of lvAttempts()){
    try{
      await lvConnect(att); L.model=att.m+' · '+att.s; L.status='live';
      try{localStorage.setItem('fp_live_ok',JSON.stringify(att));}catch(e){}
      asRender(); return;
    }catch(e){tried.push(e.message);}
  }
  lvTeardown(); L.status='error'; L.err='실시간 연결에 실패했어요. 모델 이름이 바뀌었을 수 있어요. 설정에서 "실시간 모델"을 직접 넣어 보세요.\n'+tried.slice(-3).join('\n'); asRender();
}
function lvTeardown(){
  LV.closing=true; LV.ok=false;
  try{if(LV.ws){LV.ws.onclose=null;LV.ws.onmessage=null;LV.ws.close();}}catch(e){} LV.ws=null; LV.setupDone=null;
  try{if(LV.node){LV.node.disconnect();if(LV.node.port)LV.node.port.onmessage=null;LV.node.onaudioprocess=null;}}catch(e){} LV.node=null;
  try{if(LV.msrc)LV.msrc.disconnect();}catch(e){} LV.msrc=null;
  try{if(LV.stream)LV.stream.getTracks().forEach(t=>t.stop());}catch(e){} LV.stream=null;
  try{if(LV.mctx)LV.mctx.close();}catch(e){} LV.mctx=null;
  lvFlush();
}
function asLiveStop(){lvTeardown();if(A.live)A.live.status='idle';A.mode='chat';asEnterChat();}
function asLiveEnded(why){const L=asLiveState();lvTeardown();L.status='ended';L.err=why;if(A.open&&A.mode==='live')asRender();}
function asLiveStat(){asSpeakFloat();const el=document.getElementById('lv-orb'); if(el){const L=asLiveState();el.className='lv-orb'+(L.speaking?' sp':'')+(L.status==='live'&&!L.speaking?' li':'');}}
function asLiveRender(){if(A.open&&A.mode==='live'){asRender();const b=document.getElementById('lv-lines');if(b)b.scrollTop=b.scrollHeight;}}
function asLiveBody(){
  const L=asLiveState(), nm=asName();
  const lines=L.lines.concat(L.curU.trim()?[{r:'u',t:L.curU.trim(),live:1}]:[],L.curM.trim()?[{r:'a',t:L.curM.trim(),live:1}]:[]);
  const st=L.status==='connecting'?'연결하는 중…':L.status==='live'?(L.speaking?nm+'가 말하는 중':'듣고 있어요. 그냥 말씀하세요'):L.status==='ended'?'연결이 끝났어요':'연결하지 못했어요';
  const pend=A.pending?`<div class="lm-pend"><div class="lm-pend-t">이렇게 할까요?</div><div class="lm-pend-s">${esc(A.pending.summary)}</div><div class="as-btns"><button class="as-ghost" onclick="asPendNo()">취소</button><button class="as-pri" onclick="asPendYes()">확인</button></div></div>`:'';
  return `<div class="lv-wrap"><div class="lv-orb${L.speaking?' sp':L.status==='live'?' li':''}" id="lv-orb"><span>${L.status==='error'||L.status==='ended'?'⚠':'🎙'}</span></div>
<div class="lv-st">${esc(st)}</div>${L.model&&L.status==='live'?`<div class="as-note" style="text-align:center">베타 · ${esc(L.model)}</div>`:''}
<div class="lv-lines" id="lv-lines">${lines.map(l=>`<div class="lm-b ${l.r==='u'?'u':'a'}${l.live?' lv-part':''}">${asHtml(l.t)}</div>`).join('')}</div>${pend}
${L.err?`<div class="as-err">${asHtml(L.err)}</div>`:''}
<div class="as-btns"><button class="as-ghost" onclick="asLiveStop()">← 글자 대화로</button>${L.status==='live'||L.status==='connecting'?`<button class="as-pri" onclick="asLiveStop()">대화 끝내기</button>`:`<button class="as-pri" onclick="asLiveStart()">다시 연결</button>`}</div>
<div class="as-note">소리는 Google 서버로 실시간 전송돼요. 키는 이 기기에만 있고, 조용한 곳에서 쓰면 더 잘 알아들어요.</div></div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   루미 3단계(실험): 호출어("루미야") · 푸시 알림(FCM)
   [호출어] 브라우저 음성 인식을 계속 켜 두고 이름이 들리면 대화를 연다.
     웹 앱의 한계: 화면이 켜져 있고 앱이 앞에 있을 때만 동작, 안드로이드는 인식이 다시 시작될 때 "띵" 소리가 날 수 있음,
     마이크 표시등이 계속 켜짐. 그래서 설정에서 직접 켠 기기에서만(기본 꺼짐) 쓴다.
   [푸시] 이 기기를 알림 대상으로 등록(토큰을 families/{코드}/devices 에 저장)하면, 서버(Cloud Function, functions/ 폴더)가
     준비물 요청이 올라올 때 등록된 다른 기기로 알림을 보낸다. 서버 배포는 docs/PUSH-SETUP.md 참고.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const _wk={on:false,rec:null,timer:null,errs:0,hit:'',txt:''};
function asWakeNames(){
  const n=asName().replace(/\s+/g,''); const l=[n];
  if(n==='루미')l.push('로미','르미','루이','누미','뤼미');
  return l;
}
function asWakeFind(t){
  const s=(t||'').replace(/\s+/g,''); let best=-1,len=0;
  asWakeNames().forEach(n=>{const i=s.indexOf(n); if(i>=0&&(best<0||i<best)){best=i;len=n.length;}});
  return best<0?null:{rest:(t||'').replace(/\s+/g,' ').trim().replace(new RegExp('^.*?('+asWakeNames().join('|')+')[아야]?[,\\s]*'),'')};
}
function asBeep(){
  try{asUnlock(); if(!_ac)return; const o=_ac.createOscillator(),g=_ac.createGain(); o.frequency.value=880; g.gain.value=0.05; o.connect(g);g.connect(_ac.destination); o.start(); o.stop(_ac.currentTime+0.12);}catch(e){}
}
function asWakeStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!asCfg().wakeWord||!SR||_wk.on)return; _wk.on=true; _wk.errs=0; asWakeLoop();
}
function asWakeStop(){asWakeDot(false);_wk.on=false; clearTimeout(_wk.timer); try{if(_wk.rec){_wk.rec.onend=null;_wk.rec.abort();}}catch(e){} _wk.rec=null;}
function asWakeLoop(){
  if(!_wk.on)return; clearTimeout(_wk.timer);
  // 대화 중이거나 화면이 가려져 있으면 쉰다
  if(A.open||A.listening||A.speaking||document.visibilityState!=='visible'||_wk.rec){_wk.timer=setTimeout(asWakeLoop,1500);return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const r=new SR(); _wk.rec=r;
  r.lang='ko-KR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1; _wk.hit=''; _wk.txt='';
  r.onresult=e=>{
    let t=''; for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';
    _wk.txt=t; const f=asWakeFind(t); if(!f)return; _wk.errs=0;
    if(!_wk.hit){_wk.hit='1'; clearTimeout(_wk.fire); _wk.fire=setTimeout(asWakeFire,1300);}   // 이름 뒤 말이 이어지면 같이 쓴다
    else{clearTimeout(_wk.fire); _wk.fire=setTimeout(asWakeFire,900);}
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){_wk.on=false;asSetCfg({wakeWord:false});}
    else _wk.errs++;
  };
  r.onend=()=>{_wk.rec=null; asWakeDot(false); if(_wk.on&&!_wk.hit)_wk.timer=setTimeout(asWakeLoop,_wk.errs>3?15000:700);};
  r.onstart=()=>asWakeDot(true);
  try{r.start();}catch(e){_wk.rec=null;_wk.timer=setTimeout(asWakeLoop,3000);}
}
function asWakeDot(on){
  let el=document.getElementById('as-wakedot'); if(!el){el=document.createElement('div');el.id='as-wakedot';el.className='as-wakedot';document.body.appendChild(el);}
  el.textContent='🎙 '+asName()+'야 대기 중'; el.style.display=on&&asCfg().wakeWord?'block':'none';

/* ── 7. 벽걸이 화면 켜짐 유지 시간대 (기본 07:40~08:30) ──
   Screen Wake Lock 은 "화면이 켜져 있는 동안 꺼지지 않게" 할 뿐, 꺼진 화면을 켜지는 못한다.
   시간대 밖에서는 잠금을 풀어 기기가 자체 설정대로 꺼지게 하고, 화면이 켜져 있으면 어둡게 보여 준다. */
let _wl=null;
const asHm=v=>{const p=(v||'0:0').split(':').map(Number);return p[0]*60+(p[1]||0);};
function asInWindow(now){
  const c=asCfg(); if(c.awakeMode==='always')return true;
  const m=now.getHours()*60+now.getMinutes(), f=asHm(c.awakeFrom), t=asHm(c.awakeTo);
  return f<=t?(m>=f&&m<t):(m>=f||m<t);
}
async function asWake(now){
  if(!KIOSK||!('wakeLock' in navigator))return;
  const want=asInWindow(now||new Date());
  try{
    if(want&&!_wl&&document.visibilityState==='visible'){
      const l=await navigator.wakeLock.request('screen'); _wl=l;
      if(l.addEventListener)l.addEventListener('release',()=>{if(_wl===l)_wl=null;});
    }else if(!want&&_wl){const l=_wl;_wl=null;await l.release();}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(KIOSK&&document.visibilityState==='visible'){_wl=null;asWake();}});

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function _getCookie(k){const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');return m?decodeURIComponent(m[1]):null;}
function _setCookie(k,v){document.cookie=k+'='+encodeURIComponent(v)+'; max-age=315360000; path=/; SameSite=Lax';}
function getDeviceId(){
  // localStorage가 지워져도 복원되도록 쿠키에 이중 저장. 신규 ID는 암호학적 난수 24자
  let id=localStorage.getItem('_did')||_getCookie('_did');
  if(!id){
    const b=crypto.getRandomValues(new Uint8Array(12));
    id=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  }
  try{localStorage.setItem('_did',id);}catch(e){}
  _setCookie('_did',id);
  return id;
}

/* ── 가족코드 강도 검사 / 생성 ── */
const WEAK_CODES=['123456','1234567','12345678','123456789','password','qwerty','abcdef','abc123','111111','000000','family'];
function checkCode(c){
  if(c.length<8)return'가족 코드는 8자 이상이어야 해요.';
  if(c.length>20)return'가족 코드는 20자 이하여야 해요.';
  if(/^(.)\1+$/.test(c))return'같은 문자만 반복된 코드는 사용할 수 없어요.';
  const l=c.toLowerCase();
  if(WEAK_CODES.includes(l)||l.includes('password'))return'추측하기 쉬운 코드예요. 다른 코드를 사용해 주세요.';
  if(/^\d+$/.test(c)&&c.length<8)return'숫자만 쓸 때는 8자 이상이어야 해요.';
  return'';
}
function genCode(){
  const a='abcdefghjkmnpqrstuvwxyz23456789'; // 헷갈리는 문자(i,l,o,0,1) 제외
  return Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>a[x%a.length]).join('');
}
function fillGenCode(){const el=document.getElementById('fc-input');if(el)el.value=genCode();}
// 이미 데이터가 있는 코드(=기존 가족 참가)인지 확인
async function familyHasData(code){
  try{
    const f=db.collection('families').doc(code);
    const [a,b]=await Promise.all([f.collection('items').limit(1).get(),f.collection('events').limit(1).get()]);
    return !a.empty||!b.empty;
  }catch(e){return false;}
}
async function startWithCode(){

  if(!v)return;
  // 기존 가족 코드에 참가하는 경우는 그대로 허용, 새로 만드는 코드만 강도 검사
  if(!(await familyHasData(v))){
    const err=checkCode(v);
    if(err){alert(err+'\n\n※ 이미 쓰고 있는 가족 코드에 참가하는 경우에는 코드를 정확히 다시 확인해 주세요.');return;}
  }
  setFamilyCode(v);
}
async function copyFamilyData(from,to){
  const fr=db.collection('families').doc(from),tr=db.collection('families').doc(to);
  const [it,ev,mem,tpl,gl]=await Promise.all([fr.collection('items').get(),fr.collection('events').get(),fr.collection('config').doc('members').get(),fr.collection('config').doc('templates').get(),fr.collection('config').doc('goals').get()]);
  const ops=[
    ...it.docs.map(d=>b=>b.set(tr.collection('items').doc(d.id),d.data())),
    ...ev.docs.map(d=>b=>b.set(tr.collection('events').doc(d.id),d.data())),
    ...(mem.exists?[b=>b.set(tr.collection('config').doc('members'),mem.data())]:[]),
    ...(tpl.exists?[b=>b.set(tr.collection('config').doc('templates'),tpl.data())]:[]),
    ...(gl.exists?[b=>b.set(tr.collection('config').doc('goals'),gl.data())]:[])
  ];
  await batchWrite(ops);
  // 이미지 원본은 용량이 커서(요청당 10MiB 제한) 소량씩 복사
  const im=await fr.collection('images').get();
  await batchWrite(im.docs.map(d=>b=>b.set(tr.collection('images').doc(d.id),d.data())),15);
  return{items:it.size,events:ev.size};
}
async function deleteFamilyData(code){
  const fr=db.collection('families').doc(code);
  const [it,ev,im]=await Promise.all([fr.collection('items').get(),fr.collection('events').get(),fr.collection('images').get()]);
  await batchWrite([
    ...im.docs.map(d=>b=>b.delete(d.ref)),
    ...it.docs.map(d=>b=>b.delete(d.ref)),
    ...ev.docs.map(d=>b=>b.delete(d.ref)),
    b=>b.delete(fr.collection('config').doc('members')),
    b=>b.delete(fr.collection('config').doc('templates')),
    b=>b.delete(fr.collection('config').doc('goals'))
  ]);
}
async function changeFamilyCode(){

  const code=input.trim()||genCode();
  if(code===S.familyCode){alert('현재 코드와 같아요.');return;}
  const exists=await familyHasData(code);

  const old=S.familyCode;
  try{
    if(!exists&&(S.items.length||S.events.length)){

        await copyFamilyData(old,code);
        alert(`✅ 복사 완료!\n새 가족 코드: ${code}\n가족에게 새 코드를 공유해 주세요.`);
        setFamilyCode(code);
        if(confirm('이전 코드의 데이터를 삭제할까요?\n(이전 코드를 아는 사람이 데이터를 볼 수 없게 돼요.\n아직 이전 코드를 쓰는 가족 기기가 있으면 먼저 새 코드로 바꿔 주세요.)'))await deleteFamilyData(old);
        return;
      }
      if(!confirm('데이터 없이 새 코드로만 전환할까요?\n(이전 데이터는 이전 코드에 그대로 남아요)'))return;
    }
  }catch(e){alert('코드 변경 중 오류: '+e.message);return;}
  setFamilyCode(code);
  if(!exists)alert('새 가족 코드: '+code+'\n가족에게 공유해 주세요.');
}

function updateTrend(){
  const total=S.items.reduce((a,i)=>a+i.tasks.length,0);
  const done=S.items.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
  const p=total>0?Math.round(done/total*100):0;
  const t=todayStr();
  const hist=[...S.trend];
  const ex=hist.find(h=>h.date===t);
  if(ex)ex.pct=p;else hist.push({date:t,pct:p});
  const sorted=hist.sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
  S.trend=sorted;saveTrend(sorted);
}

// 서비스워커 알림 우선(안드로이드 PWA 대응), 실패 시 일반 Notification
async function showNotif(title,body,tag){
  try{
    const reg=await navigator.serviceWorker?.getRegistration();
    if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return;}
  }catch(e){}
  try{new Notification(title,{body,tag});}catch(e){}
}
function checkAlarms(){
  if(!S.notifOn||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const fired=new Set(JSON.parse(localStorage.getItem('fired3')||'[]'));
  S.items.forEach(item=>{
    if(!item.alarmEnabled)return;
    const d=getDays(item.dueDate);
    // 마감일이 바뀌면 다시 알리도록 id+마감일을 키로 사용
    const key=item.id+'|'+item.dueDate;
    if(d!==null&&d>=0&&d<=item.alarmDaysBefore&&!fired.has(key)){
      showNotif(`📚 ${item.subject} 수행평가`,`${fmt(item.dueDate)} 마감까지 ${d}일 남았어요!`,key);
      fired.add(key);localStorage.setItem('fired3',JSON.stringify([...fired]));
    }
  });
}
async function reqNotif(){
  if(typeof Notification==='undefined'){alert('이 브라우저는 알림을 지원하지 않아요.\n(iOS는 홈 화면에 추가한 앱에서만 가능)');return;}
  const p=await Notification.requestPermission();
  if(p==='granted'){localStorage.removeItem('notifOff');S.notifOn=true;}
  setState({notif:p});
  if(p==='granted')checkAlarms();
}
// 이 기기 알림 켜기/끄기 (권한이 없으면 권한 요청부터)
function toggleNotif(){
  if(S.notif!=='granted'){reqNotif();return;}
  const on=!S.notifOn;
  if(on)localStorage.removeItem('notifOff');else localStorage.setItem('notifOff','1');
  setState({notifOn:on});
  if(on){showNotif('🔔 알림이 켜졌어요','마감 임박 수행평가를 알려드릴게요.','toggle-on');checkAlarms();}
}
function testNotif(){
  if(S.notif!=='granted'){reqNotif();return;}
  showNotif('📚 알림 테스트','알림이 정상적으로 표시돼요!','test-'+Date.now());
}
function notifBtn(){
  if(typeof Notification==='undefined')return'';
  if(S.notif==='denied')return`<button class="notif-btn off" onclick="alert('브라우저 설정에서 이 사이트의 알림 권한을 허용해주세요.')">🔕 차단됨</button>`;
  if(S.notif!=='granted')return`<button class="notif-btn" onclick="reqNotif()">🔔 알림</button>`;
  return`<button class="notif-btn ${S.notifOn?'on':'off'}" onclick="toggleNotif()">${S.notifOn?'🔔 켜짐':'🔕 꺼짐'}</button>`;
}
function notifStatusText(){
  if(typeof Notification==='undefined')return'이 브라우저는 알림을 지원하지 않아요';
  if(S.notif==='denied')return'브라우저 설정에서 알림이 차단되어 있어요';
  if(S.notif!=='granted')return'켜면 알림 권한을 요청해요';
  return S.notifOn?'마감 임박 시 이 기기로 알려요':'이 기기에서는 알림을 받지 않아요';
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   캘린더(.ics) 내보내기 — OS 캘린더가 백그라운드 알림 담당
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
function icsFold(line){ // 75바이트 제한 → UTF-8 바이트 기준으로 줄바꿈
  const enc=new TextEncoder();let out='',cur='',bytes=0;
  for(const ch of line){const n=enc.encode(ch).length;
    if(bytes+n>73){out+=cur+'\r\n ';cur='';bytes=1;}
    cur+=ch;bytes+=n;}
  return out+cur;
}
function icsEvent(item){
  const [y,m,d]=item.dueDate.split('-').map(Number);
  const p2=n=>String(n).padStart(2,'0');
  const nx=new Date(Date.UTC(y,m-1,d+1));
  const ds=y+p2(m)+p2(d);
  const de=nx.getUTCFullYear()+p2(nx.getUTCMonth()+1)+p2(nx.getUTCDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const n=Math.max(1,Number(item.alarmDaysBefore)||3);
  const desc=[...(item.person?[`담당: ${item.person}`]:[]),`중요도: ${PRI_NAME[item.priority||2]}`,`진행률: ${pct(item)}%`,
    ...item.tasks.map((t,i)=>`${i+1}. [${t.done?'✓':' '}] ${t.text}`),
    ...(item.memo?[`메모: ${item.memo}`]:[])].join('\n');
  const alarms=item.alarmEnabled?[
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(item.subject)} 수행평가 마감 ${n}일 전`,`TRIGGER:-P${n-1}DT15H`,'END:VALARM', // n일 전 09:00
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(item.subject)} 수행평가 오늘 마감`,'TRIGGER:PT8H','END:VALARM'           // 당일 08:00
  ]:[];
  return['BEGIN:VEVENT',`UID:${item.id}@family-plan`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${de}`,
    `SUMMARY:${icsEsc('📚 '+item.subject+' 수행평가')}`,`DESCRIPTION:${icsEsc(desc)}`,
    'TRANSP:TRANSPARENT',...alarms,'END:VEVENT'];
}
function downloadICS(vevents,filename){ // vevents: VEVENT 줄 배열들의 배열
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//family-plan//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    ...vevents.flat(),'END:VCALENDAR'];
  const ics=lines.map(icsFold).join('\r\n')+'\r\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
  a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportItemICS(id){
  const item=S.items.find(i=>i.id===id);if(!item||!item.dueDate)return;
  downloadICS([icsEvent(item)],`${item.subject}_${item.dueDate}.ics`);
}
function exportAllICS(){
  const list=S.items.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d>=0&&!(i.tasks.length>0&&i.tasks.every(t=>t.done));});
  if(!list.length){alert('캘린더로 내보낼 진행중 수행평가가 없어요.');return;}
  downloadICS(list.map(icsEvent),`패밀리플랜_수행평가_${todayStr()}.ics`);
}
// 가족 일정(events) → .ics (종일: 전날 09:00 알림 / 시간 지정: 30분 전 알림)
function icsEventEvt(ev){
  const sd=ev.startDate||ev.date,ed=ev.endDate||sd;
  const p2=n=>String(n).padStart(2,'0');
  const compact=d=>d.replace(/-/g,'');
  const local=dt=>dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+'T'+p2(dt.getHours())+p2(dt.getMinutes())+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ci=evtCatInfo(ev.category||'일반');
  const timed=ev.allDay===false&&ev.startTime;
  let dtstart,dtend,trigger;
  if(timed){
    const s=new Date(sd+'T'+ev.startTime+':00');
    let e=ev.endTime?new Date(ed+'T'+ev.endTime+':00'):null;
    if(!e||e<=s)e=new Date(s.getTime()+3600000); // 종료시간 없거나 시작 이전이면 1시간
    dtstart='DTSTART:'+local(s);dtend='DTEND:'+local(e);trigger='-PT30M';
  }else{
    const [y,m,d]=ed.split('-').map(Number);
    const nx=new Date(Date.UTC(y,m-1,d+1));
    dtstart='DTSTART;VALUE=DATE:'+compact(sd);
    dtend='DTEND;VALUE=DATE:'+nx.getUTCFullYear()+p2(nx.getUTCMonth()+1)+p2(nx.getUTCDate());
    trigger='-PT15H'; // 일정 전날 09:00
  }
  const rr=[];
  if(ev.repeat){
    const fq={weekly:'FREQ=WEEKLY',biweekly:'FREQ=WEEKLY;INTERVAL=2',monthly:'FREQ=MONTHLY',yearly:'FREQ=YEARLY'}[ev.repeat];
    rr.push('RRULE:'+fq+(ev.repeatUntil?';UNTIL='+compact(ev.repeatUntil)+(timed?'T235959':''):''));
    const ex=ev.exdates||[];
    if(ex.length)rr.push(timed?'EXDATE:'+ex.map(d=>compact(d)+'T'+ev.startTime.replace(':','')+'00').join(','):'EXDATE;VALUE=DATE:'+ex.map(compact).join(','));
  }
  const desc=[`분류: ${ci[0]} ${ev.category||'일반'}`,...(ev.person?[`담당: ${ev.person}`]:[]),...(ev.memo?[`메모: ${ev.memo}`]:[])].join('\n');
  return['BEGIN:VEVENT',`UID:evt-${ev.id}@family-plan`,`DTSTAMP:${stamp}`,dtstart,dtend,...rr,
    `SUMMARY:${icsEsc(ci[0]+' '+ev.title)}`,`DESCRIPTION:${icsEsc(desc)}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(ev.title)}`,`TRIGGER:${trigger}`,'END:VALARM','END:VEVENT'];
}
function exportEvtICS(id){
  const ev=S.events.find(e=>e.id===id);if(!ev||!(ev.startDate||ev.date))return;
  downloadICS([icsEventEvt(ev)],`${ev.title}_${ev.startDate||ev.date}.ics`);
}
function exportAllEvtICS(){
  const today=todayStr();
  const list=S.events.filter(e=>e.repeat?(!e.repeatUntil||e.repeatUntil>=today):(e.endDate||e.startDate||e.date)>=today);
  if(!list.length){alert('캘린더로 내보낼 다가오는 일정이 없어요.');return;}
  downloadICS(list.map(icsEventEvt),`패밀리플랜_일정_${today}.ics`);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   반복 일정 — 규칙만 저장하고 보이는 범위에서 펼쳐서 사용
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const REPEAT_OPTS=[['','반복 안 함'],['weekly','매주'],['biweekly','2주마다'],['monthly','매월'],['yearly','매년']];
const repLabel=r=>(REPEAT_OPTS.find(o=>o[0]===r)||REPEAT_OPTS[0])[1];
const parseD=ds=>{const [y,m,d]=ds.split('-').map(Number);return Date.UTC(y,m-1,d);};
const fmtD=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');};
const addDays=(ds,n)=>fmtD(parseD(ds)+n*86400000);
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
function addMonths(ds,n){ // 31일 → 말일로 보정, 시작일 기준으로 계산해 오차 누적 방지
  const [y,m,d]=ds.split('-').map(Number);
  const t=(m-1)+n,ty=y+Math.floor(t/12),tm=((t%12)+12)%12;
  const dim=new Date(Date.UTC(ty,tm+1,0)).getUTCDate();
  return ty+'-'+String(tm+1).padStart(2,'0')+'-'+String(Math.min(d,dim)).padStart(2,'0');
}
function nthStart(ev,i){
  const s0=ev.startDate||ev.date;
  if(ev.repeat==='weekly')return addDays(s0,7*i);
  if(ev.repeat==='biweekly')return addDays(s0,14*i);
  if(ev.repeat==='monthly')return addMonths(s0,i);
  if(ev.repeat==='yearly')return addMonths(s0,12*i);
  return s0;
}
// [from,to] 날짜 범위와 겹치는 발생(occurrence) 목록. 반복 안 하면 원본 1건
function occurrences(ev,from,to){
  const s0=ev.startDate||ev.date;if(!s0)return[];
  const span=Math.max(0,diffDays(s0,ev.endDate||s0));
  if(!ev.repeat)return(s0<=to&&addDays(s0,span)>=from)?[ev]:[];
  const ex=new Set(ev.exdates||[]),out=[];
  let i0=0;
  if(ev.repeat==='weekly'||ev.repeat==='biweekly'){const step=ev.repeat==='weekly'?7:14;i0=Math.max(0,Math.floor((diffDays(s0,from)-span)/step)-1);}
  for(let i=i0;i<i0+2000;i++){
    const st=nthStart(ev,i);
    if(st>to||(ev.repeatUntil&&st>ev.repeatUntil))break;
    if(addDays(st,span)<from||ex.has(st))continue;
    out.push(st===s0?ev:{...ev,startDate:st,endDate:addDays(st,span),date:st,_occ:true});
  }
  return out;
}
function nextOccurrence(ev,today){
  if(!ev.repeat)return(ev.endDate||ev.startDate||ev.date)>=today?ev:null;
  return occurrences(ev,today,addDays(today,366*5))[0]||null;
}

  const r=document.getElementById('ef-until-row');if(r)r.style.display=v?'block':'none';

// 폼 입력값을 S.form에 보존 (재렌더 시 입력 중이던 내용이 사라지지 않게)
function syncFormFromDOM(){
  const g=id=>document.getElementById(id),f=S.form;if(!f)return;
  if(g('f-subj'))f.subject=g('f-subj').value;
  if(g('f-date'))f.dueDate=g('f-date').value;
  if(g('f-score'))f.maxScore=Number(g('f-score').value)||0;

function saveAsTemplate(){
  syncFormFromDOM();
  const f=S.form,subj=(f.subject||'').trim();
  const tasks=f.tasks.map(t=>t.text.trim()).filter(Boolean);
  if(!subj){alert('과목을 입력하세요.');return;}
  if(!tasks.length){alert('수행 내용을 하나 이상 입력하세요.');return;}
  const name=(prompt('템플릿 이름 (20자 이내)',subj+' 수행평가')||'').trim().slice(0,20);
  if(!name)return;
  const dup=S.templates.find(t=>t.name===name);
  if(dup&&!confirm(`'${name}' 템플릿이 이미 있어요. 덮어쓸까요?`))return;
  if(!dup&&S.templates.length>=30){alert('템플릿은 최대 30개까지 저장할 수 있어요.');return;}
  const tpl={id:dup?dup.id:uid(),name,subject:subj,color:(f.subjectColor||getColor(subj)).accent,tasks,
    maxScore:f.maxScore||0,priority:f.priority||2,alarmEnabled:!!f.alarmEnabled,alarmDaysBefore:f.alarmDaysBefore||3,
    memo:f.memo||'',person:f.person||''};
  saveTemplates([...S.templates.filter(t=>t.name!==name),tpl]);
  alert(`💾 '${name}' 템플릿을 저장했어요.`);
}
function applyTemplate(id){
  const t=S.templates.find(x=>x.id===id);if(!t)return;
  syncFormFromDOM();
  const sc=SUBJECTS.find(x=>x.name===t.subject)||{name:t.subject,bg:t.color+'22',accent:t.color,tag:t.color+'55'};
  Object.assign(S.form,{subject:t.subject,subjectColor:sc,tasks:t.tasks.map(x=>({id:uid(),text:x,done:false})),
    maxScore:t.maxScore,priority:t.priority,alarmEnabled:t.alarmEnabled,alarmDaysBefore:t.alarmDaysBefore,
    memo:t.memo||S.form.memo,person:t.person||S.form.person});
  render();
}
function removeTemplate(id){
  const t=S.templates.find(x=>x.id===id);if(!t)return;
  if(!confirm(`'${t.name}' 템플릿을 삭제할까요?\n(이미 만든 수행평가에는 영향 없어요)`))return;
  saveTemplates(S.templates.filter(x=>x.id!==id));
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   이번 주 할 일 요약 (오늘부터 7일)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const WDAY=['일','월','화','수','목','금','토'];
const isAllDone=i=>i.tasks.length>0&&i.tasks.every(t=>t.done);
function dayLabel(ds,k){
  const w=WDAY[new Date(parseD(ds)).getUTCDay()];
  return(k===0?'오늘':k===1?'내일':fmt(ds))+` · ${w}`;
}
function weekSummary(){
  const today=todayStr(),end=addDays(today,6);
  const days=Array.from({length:7},(_,k)=>({k,ds:addDays(today,k),items:[],evs:[]}));
  const items=visItems();
  const overdue=items.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d<0&&!isAllDone(i);})
    .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  items.forEach(i=>{
    if(!i.dueDate||isAllDone(i))return;
    const k=diffDays(today,i.dueDate);
    if(k>=0&&k<7)days[k].items.push(i);
  });
  visEvents().flatMap(e=>occurrences(e,today,end)).forEach(e=>{
    const s0=e.startDate||e.date,e0=e.endDate||s0;
    days.forEach(d=>{if(d.ds>=s0&&d.ds<=e0)d.evs.push({ev:e,nth:diffDays(s0,d.ds)+1,total:diffDays(s0,e0)+1});});
  });
  days.forEach(d=>d.evs.sort((a,b)=>(a.ev.allDay===false?a.ev.startTime||'99':'00').localeCompare(b.ev.allDay===false?b.ev.startTime||'99':'00')));
  return{overdue,days};
}
function toggleWeek(){S.weekOpen=!S.weekOpen;try{localStorage.setItem('weekOpen',S.weekOpen?'1':'0');}catch(e){}render();}
function buildWeekCard(){
  if(S.syncStatus==='connecting'&&!S.items.length&&!S.events.length)return'';
  const {overdue,days}=weekSummary();
  const nItems=days.reduce((a,d)=>a+d.items.length,0);
  const evKeys=new Set();days.forEach(d=>d.evs.forEach(x=>evKeys.add(x.ev.id+'|'+(x.ev.startDate||x.ev.date))));
  const head=`<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleWeek()">
    <div class="wk-title">📌 이번 주 할 일 <span class="wk-sub">오늘부터 7일</span></div>
    <span style="font-size:calc(14px*var(--fs));color:var(--muted)">${S.weekOpen?'▲':'▼'}</span></div>
    <div class="wk-stats">
      <span class="wk-chip">📝 마감 <b>${nItems}</b></span>
      <span class="wk-chip">📅 일정 <b>${evKeys.size}</b></span>
      ${overdue.length?`<span class="wk-chip" style="color:var(--danger)">⚠️ 지연 <b>${overdue.length}</b></span>`:''}
    </div>`;
  if(!S.weekOpen)return`<div class="wk-card">${head}</div>`;
  const itemRow=i=>{
    const sc=getColor(i.subject),bd=dBadge(getDays(i.dueDate),false,sc);
    const nxt=i.tasks.find(t=>!t.done),dn=i.tasks.filter(t=>t.done).length;
    return`<div class="wk-row" onclick="openDetail('${i.id}')">
      <span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(i.subject)}</span>
      <span class="wk-txt">${nxt?esc(nxt.text):'모든 단계 완료'}<span class="wk-dim"> ${dn}/${i.tasks.length}</span></span>
      ${personPill(i.person)}<span class="d-badge" style="background:${bd.c}">${bd.t}</span></div>`;};
  const evRow=({ev,nth,total})=>{
    const ci=evtCatInfo(ev.category||'일반'),col=ev.color||ci[2];
    const when=ev.allDay===false&&ev.startTime?ev.startTime:'종일';
    return`<div class="wk-row" onclick="openEvtDetail('${ev.id}','${ev.startDate||ev.date}')">
      <span class="evt-cat" style="background:${col}22;color:${col}">${ci[0]}</span>
      <span class="wk-txt">${esc(ev.title)}${total>1?`<span class="wk-dim"> ${nth}/${total}일차</span>`:''}${ev.repeat?' 🔁':''}<span class="wk-dim"> ${when}</span></span>
      ${personPill(ev.person)}</div>`;};
  const od=overdue.length?`<div class="wk-day" style="color:var(--danger)">⚠️ 기한 지난 미완료</div>${overdue.map(i=>{
    const sc=getColor(i.subject);
    return`<div class="wk-row" onclick="openDetail('${i.id}')"><span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(i.subject)}</span><span class="wk-txt">${esc((i.tasks.find(t=>!t.done)||{}).text||'')}<span class="wk-dim"> ${i.tasks.filter(t=>t.done).length}/${i.tasks.length}</span></span>${personPill(i.person)}<span class="d-badge" style="background:#9E9E9E">${fmt(i.dueDate)}</span></div>`;}).join('')}`:'';
  const body=days.filter(d=>d.items.length||d.evs.length).map(d=>
    `<div class="wk-day">${dayLabel(d.ds,d.k)}</div>${d.items.map(itemRow).join('')}${d.evs.map(evRow).join('')}`).join('');
  return`<div class="wk-card">${head}${od}${body||(overdue.length?'':'<div class="wk-empty">🎉 이번 주는 예정된 마감·일정이 없어요</div>')}</div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   검색 — 수행평가(과목·단계·메모·담당자·첨부 텍스트) + 일정(제목·메모·담당자·분류)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const searchBtn=()=>`<button class="icon-btn" onclick="openSearch()" aria-label="검색">🔍</button>`;
function hl(text,toks){
  const raw=String(text||'');
  if(!toks.length)return esc(raw);
  const re=new RegExp('('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return raw.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}
function openSearch(){
  if(document.getElementById('srch-ov'))return;
  S.searchOpen=true;
  const div=document.createElement('div');div.id='srch-ov';div.className='srch-ov';
  div.innerHTML=`<div class="srch-bar"><input id="srch-in" class="f-input" type="search" placeholder="과목 · 단계 · 메모 · 담당자 · 일정 검색" oninput="runSearch(this.value)" autocomplete="off"><button class="srch-x" onclick="closeSearch()">닫기</button></div><div id="srch-res" class="srch-res"></div>`;
  document.body.appendChild(div);
  runSearch('');
  setTimeout(()=>document.getElementById('srch-in')?.focus(),50);
}
function closeSearch(){const el=document.getElementById('srch-ov');if(el)el.remove();S.searchOpen=false;}
function searchSet(v){const el=document.getElementById('srch-in');if(el){el.value=v;runSearch(v);el.focus();}}
function goSearch(type,id,date){closeSearch();if(type==='i')openDetail(id);else openEvtDetail(id,date);}
function runSearch(q){
  const res=document.getElementById('srch-res');if(!res)return;
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length){
    const subs=[...new Set(S.items.map(i=>i.subject))].slice(0,12);
    const chips=[...subs,...S.members.map(m=>m.name)];
    res.innerHTML=`<div class="srch-hint">🔍 과목, 수행 단계, 메모, 담당자, 일정 제목을 검색해요<br><small>여러 단어는 띄어쓰기로 (예: <b>수학 보고서</b>)</small></div>${chips.length?`<div class="person-chips" style="justify-content:center;margin-top:14px">${chips.map(c=>`<div class="pchip" style="--c:var(--p)" data-q="${esc(c)}" onclick="searchSet(this.dataset.q)">${esc(c)}</div>`).join('')}</div>`:''}`;
    return;
  }
  const today=todayStr();
  const hit=fields=>{const hay=fields.map(f=>f[1]).join('\n').toLowerCase();return toks.every(t=>hay.includes(t))?fields:null;};
  // 수행평가
  const items=[];
  S.items.forEach(i=>{
    const f=hit([['과목',i.subject],['담당',i.person],['메모',i.memo],['날짜',fmt(i.dueDate)],
      ...i.tasks.map(t=>['단계',t.text]),...(i.attachments||[]).filter(a=>a.type==='txt').map(a=>['첨부',a.data])]);
    if(f)items.push({i,f});
  });
  items.sort((a,b)=>(isAllDone(a.i)-isAllDone(b.i))||(isAllDone(a.i)?b.i.dueDate.localeCompare(a.i.dueDate):a.i.dueDate.localeCompare(b.i.dueDate)));
  // 일정
  const evs=[];
  S.events.forEach(e=>{
    const o=nextOccurrence(e,today)||e;
    const f=hit([['제목',e.title],['분류',e.category],['담당',e.person],['메모',e.memo],['날짜',fmtDateRange(o)]]);
    if(f)evs.push({e:o,f});
  });
  evs.sort((a,b)=>(a.e.startDate||a.e.date).localeCompare(b.e.startDate||b.e.date));
  const snip=f=>{ // 과목·날짜 외에 일치한 항목을 보여줌
    const m=f.find(x=>x[0]!=='과목'&&x[0]!=='제목'&&x[0]!=='날짜'&&toks.some(t=>String(x[1]||'').toLowerCase().includes(t)));
    return m?`<div class="srch-snip"><span class="srch-fl">${m[0]}</span>${hl(String(m[1]).slice(0,80),toks)}</div>`:'';};
  const itemHtml=items.slice(0,50).map(({i,f})=>{
    const sc=getColor(i.subject),bd=dBadge(getDays(i.dueDate),isAllDone(i),sc);
    return`<div class="srch-row" onclick="goSearch('i','${i.id}')">
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${hl(i.subject,toks)}</span>${personPill(i.person)}<span class="wk-dim">📅 ${fmt(i.dueDate)}</span><span class="d-badge" style="background:${bd.c};margin-left:auto">${bd.t}</span></div>${snip(f)}</div>`;}).join('');
  const evHtml=evs.slice(0,50).map(({e,f})=>{
    const ci=evtCatInfo(e.category||'일반'),col=e.color||ci[2];
    return`<div class="srch-row" onclick="goSearch('e','${e.id}','${e.startDate||e.date}')">
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span class="evt-cat" style="background:${col}22;color:${col}">${ci[0]} ${esc(e.category||'일반')}</span><b style="font-size:calc(14px*var(--fs))">${hl(e.title,toks)}${e.repeat?' 🔁':''}</b>${personPill(e.person)}</div>
      <div class="wk-dim" style="margin-top:3px">📅 ${fmtDateRange(e)}</div>${snip(f)}</div>`;}).join('');
  res.innerHTML=!items.length&&!evs.length
    ?`<div class="srch-hint">😶 '${esc(q)}' 검색 결과가 없어요</div>`
    :`${items.length?`<div class="srch-sec">📝 수행평가 ${items.length}</div>${itemHtml}`:''}${evs.length?`<div class="srch-sec">📅 일정 ${evs.length}</div>${evHtml}`:''}`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   성적 분석 — 학기별 · 과목별 누적 점수율, 추이, 목표 점수
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const semKey=ds=>{const [y,m]=ds.split('-').map(Number);return m>=3&&m<=7?`${y}-1`:m>=8?`${y}-2`:`${y-1}-2`;}; // 1학기 3~7월 / 2학기 8~2월
const semLabel=k=>{const [y,n]=k.split('-');return`${y}년 ${n}학기`;};
const isScored=i=>i.earnedScore!==null&&i.earnedScore!==undefined&&i.earnedScore!==''&&Number(i.maxScore)>0;
const GRADE=p=>p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'E'; // 참고용 성취수준
const GRADE_COLOR={A:'#4CAF50',B:'#2196F3',C:'#FF9800',D:'#FF7043',E:'#F44336'};
const fmtP=v=>(Math.round(v*10)/10)+'%';
const goalOf=n=>(S.goals.find(g=>g.subject===n)||{}).target||null;

let unsubGoals=null;
function startGoalsSync(code){
  if(unsubGoals)unsubGoals();
  unsubGoals=db.collection('families').doc(code).collection('config').doc('goals')
    .onSnapshot(s=>{const l=s.exists?s.data().list:null;S.goals=Array.isArray(l)?l:[];renderKeep();},
      err=>console.warn('goals sync err',err));
}
function saveGoals(list){
  S.goals=list;render();
  if(!S.familyCode)return;
  db.collection('families').doc(S.familyCode).collection('config').doc('goals').set({list})
    .catch(e=>alert('목표 저장 실패: '+e.message+'\n(Firestore 규칙 최신본이 게시됐는지 확인해 주세요)'));
}
function setGoal(subject){
  const cur=goalOf(subject);
  const v=prompt(`'${subject}' 목표 점수율 (%)\n1~100 사이 숫자 · 비우면 목표 삭제${cur?`\n현재 목표: ${cur}%`:''}`,cur||'');
  if(v===null)return;
  const t=v.trim();
  if(!t){saveGoals(S.goals.filter(g=>g.subject!==subject));return;}
  const n=Math.round(Number(t));
  if(!(n>=1&&n<=100)){alert('1~100 사이의 숫자를 입력해 주세요.');return;}
  if(!cur&&S.goals.length>=30){alert('목표는 최대 30개까지 설정할 수 있어요.');return;}
  saveGoals([...S.goals.filter(g=>g.subject!==subject),{subject,target:n}]);
}
function setStatsView(v){try{localStorage.setItem('statsView',v);}catch(e){}setState({statsView:v});}
function statsTabs(){
  return`<div class="seg" style="margin:0 0 10px">${[['progress','📋 진행'],['score','🏆 성적']].map(([v,l])=>`<button class="${S.statsView===v?'sel':''}" onclick="setStatsView('${v}')">${l}</button>`).join('')}</div>`;
}
function scoreData(){
  const all=visItems().filter(i=>i.dueDate);
  const sems=[...new Set(all.map(i=>semKey(i.dueDate)))].sort().reverse();
  const cur=semKey(todayStr());
  const sem=S.scoreSem==='auto'?(sems.includes(cur)?cur:'all'):(S.scoreSem==='all'||sems.includes(S.scoreSem)?S.scoreSem:'all');
  const list=sem==='all'?all:all.filter(i=>semKey(i.dueDate)===sem);
  const scored=list.filter(isScored).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const pending=list.filter(i=>!isScored(i)&&getDays(i.dueDate)<0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const subs={};
  list.forEach(i=>{
    const o=subs[i.subject]||(subs[i.subject]={name:i.subject,earned:0,max:0,n:0,totalMax:0,remMax:0,remN:0});
    o.totalMax+=Number(i.maxScore)||0;
    if(isScored(i)){o.earned+=Number(i.earnedScore);o.max+=Number(i.maxScore);o.n++;}
    else{o.remMax+=Number(i.maxScore)||0;o.remN++;}
  });
  const rows=Object.values(subs).filter(o=>o.n>0).map(o=>({...o,pct:o.earned/o.max*100})).sort((a,b)=>b.pct-a.pct);
  const noScore=Object.values(subs).filter(o=>o.n===0);
  return{sems,sem,list,scored,pending,rows,noScore,allSubjects:Object.values(subs).map(o=>o.name)};
}
function scoreChart(pts,goal){
  const W=320,H=160,L=28,R=10,T=16,B=22;
  const x=i=>pts.length===1?L+(W-L-R)/2:L+i/(pts.length-1)*(W-L-R);
  const y=p=>T+(1-Math.max(0,Math.min(100,p))/100)*(H-T-B);
  const P=pts.map((o,i)=>({x:x(i),y:y(o.p),...o}));
  const grid=[0,50,70,90,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="ch-g"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" font-size="8" class="ch-t">${v}</text>`).join('');
  const many=pts.length>10;
  const hi=Math.max(...pts.map(o=>o.p)),lo=Math.min(...pts.map(o=>o.p));
  const dots=P.map((o,i)=>{
    const show=!many||i===0||i===P.length-1||o.p===hi||o.p===lo;
    return`<circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${many?3:4}" fill="${o.c}" stroke="var(--card)" stroke-width="1.5"/>${show?`<text x="${o.x.toFixed(1)}" y="${(o.y-7).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" class="ch-v">${Math.round(o.p)}</text>`:''}`;}).join('');
  const line=P.length>1?`<polyline points="${P.map(o=>o.x.toFixed(1)+','+o.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--p)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`:'';
  const gl=goal?`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#FF5252" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(goal)-3}" text-anchor="end" font-size="8" font-weight="700" fill="#FF5252">목표 ${goal}%</text>`:'';
  const xl=[0,Math.floor((P.length-1)/2),P.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${P[i].x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8" class="ch-t">${P[i].d.slice(5).replace('-','/')}</text>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="height:auto">${grid}${gl}${line}${dots}${xl}</svg>`;
}
function setScoreSem(v){setState({scoreSem:v});}
function setScoreSubj(v){setState({scoreSubj:v});}
function buildScoreView(){
  const D=scoreData();
  const {sems,sem,scored,pending,rows}=D;
  if(S.scoreSubj&&!D.allSubjects.includes(S.scoreSubj))S.scoreSubj='';
  const wTot=scored.reduce((a,i)=>a+Number(i.maxScore),0),wEarn=scored.reduce((a,i)=>a+Number(i.earnedScore),0);
  const overall=wTot>0?wEarn/wTot*100:null;
  const chipBar=(items,cur,fn)=>`<div class="ctrl-bar" style="padding:0 0 10px">${items.map(([v,l])=>`<button class="filter-btn${cur===v?' active':''}" data-v="${esc(v)}" onclick="${fn}(this.dataset.v)">${esc(l)}</button>`).join('')}</div>`;
  const semBar=sems.length?chipBar([['all','전체'],...sems.map(k=>[k,semLabel(k)])],sem,'setScoreSem'):'';
  // 요약
  const best=rows[0],worst=rows.length>1?rows[rows.length-1]:null;
  const goalRows=rows.filter(r=>goalOf(r.name));
  const hit=goalRows.filter(r=>r.pct>=goalOf(r.name)).length;
  const summary=`<div class="summary-grid" style="margin-bottom:14px">
    <div class="sum-card"><div class="sum-val" style="color:var(--p)">${overall!==null?fmtP(overall):'--'}</div><div class="sum-lbl">누적 점수율${overall!==null?` · ${wEarn}/${wTot}점`:''}</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--ok)">${scored.length}</div><div class="sum-lbl">점수 입력된 평가</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#FF9800">${best?esc(best.name):'--'}</div><div class="sum-lbl">${best?'최고 · '+fmtP(best.pct):'최고 과목'}</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--danger)">${worst?esc(worst.name):'--'}</div><div class="sum-lbl">${worst?'보완 · '+fmtP(worst.pct):'보완 과목'}</div></div>
  </div>`;
  // 인사이트
  const tips=[];
  if(scored.length>=4){
    const r3=scored.slice(-3),pr=scored.slice(-6,-3);
    const avg=a=>a.reduce((x,i)=>x+Number(i.earnedScore)/Number(i.maxScore)*100,0)/a.length;
    if(pr.length){const d=avg(r3)-avg(pr);tips.push(d>=3?`📈 최근 ${r3.length}회 평균이 이전보다 <b>${Math.round(d)}%p</b> 올랐어요`:d<=-3?`📉 최근 ${r3.length}회 평균이 이전보다 <b>${Math.round(-d)}%p</b> 내려갔어요`:'➖ 최근 점수가 이전과 비슷해요');}
  }
  if(goalRows.length)tips.push(`🎯 목표를 정한 ${goalRows.length}과목 중 <b>${hit}과목</b> 달성`);
  if(pending.length)tips.push(`📝 마감이 지났는데 점수를 입력하지 않은 평가가 <b>${pending.length}개</b> 있어요`);
  const insight=tips.length?`<div class="stat-section"><div class="stat-section-title">💡 한눈에 보기</div>${tips.map(t=>`<div class="sc-tip">${t}</div>`).join('')}</div>`:'';
  // 과목별 (누적, 목표, 성취수준)
  const noScoreHtml=D.noScore.map(o=>{const goal=goalOf(o.name);return`<div class="sc-item" data-s="${esc(o.name)}" onclick="setGoal(this.dataset.s)"><div class="sc-sub" style="padding-left:0"><b style="color:var(--text)">${esc(o.name)}</b> · 아직 입력된 점수 없음 (평가 ${o.remN}개 · 배점 ${o.remMax}점)${goal?` · 🎯 목표 ${goal}%`:' · 탭하여 목표 설정'}</div></div>`;}).join('');
  const subjHtml=(rows.length===0&&!D.noScore.length)?`<div class="no-data">🏆 점수가 입력된 수행평가가 없어요<br><small style="color:#BBB">수행평가 상세에서 점수를 입력하면 분석돼요</small></div>`
    :rows.map(r=>{
      const goal=goalOf(r.name),sc=getColor(r.name),g=GRADE(r.pct);
      let line=`누적 ${r.earned}/${r.max}점 · 평가 ${r.n}개`;
      if(goal){
        const diff=r.pct-goal;
        line+=` · 목표 ${goal}% (${diff>=0?'+':''}${Math.round(diff*10)/10}%p)`;
        if(r.remMax>0){
          const need=(goal/100*r.totalMax-r.earned)/r.remMax*100;
          line+=need<=0?`<br>✅ 남은 ${r.remN}개와 상관없이 목표 달성`:need>100?`<br>⚠️ 남은 ${r.remN}개(배점 ${r.remMax}점)로는 목표 달성이 어려워요`:`<br>🔎 남은 ${r.remN}개(배점 ${r.remMax}점)에서 평균 <b>${Math.ceil(need)}%</b> 이상 필요`;
        }else if(diff<0)line+='<br>⚠️ 남은 평가가 없어 목표에 못 미쳐요';
      }
      return`<div class="sc-item" data-s="${esc(r.name)}" onclick="setGoal(this.dataset.s)">
        <div class="score-bar-row" style="margin-bottom:3px"><div class="score-bar-label">${esc(r.name)}</div>
          <div class="sc-track"><div class="score-bar-fill" style="width:${Math.min(100,r.pct)}%;background:${sc.accent}">${fmtP(r.pct)}</div>${goal?`<div class="sc-goal" style="left:${goal}%"></div>`:''}</div>
          <div class="sc-grade" style="background:${GRADE_COLOR[g]}">${g}</div></div>
        <div class="sc-sub">${line}</div></div>`;}).join('')+`<div class="sc-hint">과목을 탭하면 목표 점수율을 설정해요 · 등급은 점수율 기준 참고용(A 90↑ B 80↑ C 70↑ D 60↑)</div>`;
  const subjAll=subjHtml.replace(/<div class="sc-hint">[\s\S]*$/,'')+noScoreHtml+(rows.length||D.noScore.length?`<div class="sc-hint">과목을 탭하면 목표 점수율을 설정해요 · 등급은 점수율 기준 참고용(A 90↑ B 80↑ C 70↑ D 60↑)</div>`:'');
  // 추이
  const trendPts=(S.scoreSubj?scored.filter(i=>i.subject===S.scoreSubj):scored).map(i=>({p:Number(i.earnedScore)/Number(i.maxScore)*100,d:i.dueDate,c:getColor(i.subject).accent}));
  const subjChips=D.allSubjects.length>1?chipBar([['','전체'],...rows.map(r=>[r.name,r.name])],S.scoreSubj,'setScoreSubj'):'';
  const trend=trendPts.length<2?`<div class="no-data">📈 점수가 2개 이상 입력되면 추이가 보여요</div>`
    :scoreChart(trendPts,S.scoreSubj?goalOf(S.scoreSubj):null);
  // 구성원별 (필터 해제 시)
  let memHtml='';
  if(!S.personFilter&&S.members.length){
    const src=(sem==='all'?S.items.filter(i=>i.dueDate):S.items.filter(i=>i.dueDate&&semKey(i.dueDate)===sem)).filter(isScored);
    const mr=S.members.map(m=>{const l=src.filter(i=>i.person===m.name);if(!l.length)return null;
      const e=l.reduce((a,i)=>a+Number(i.earnedScore),0),t=l.reduce((a,i)=>a+Number(i.maxScore),0);return{name:m.name,color:m.color,pct:e/t*100,n:l.length};}).filter(Boolean);
    if(mr.length)memHtml=`<div class="stat-section"><div class="stat-section-title">👥 구성원별 누적 점수율</div>${mr.map(r=>`<div class="score-bar-row"><div class="score-bar-label">${esc(r.name)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(100,r.pct)}%;background:${r.color}">${fmtP(r.pct)}</div></div><div class="score-bar-val">${r.n}개</div></div>`).join('')}</div>`;
  }
  // 점수 미입력
  const pend=pending.length?`<div class="stat-section"><div class="stat-section-title">📝 점수 입력 대기 <span style="font-weight:500;color:var(--muted);font-size:calc(11px*var(--fs))">탭해서 입력</span></div>${pending.slice(0,8).map(i=>{const sc=getColor(i.subject);return`<div class="wk-row" onclick="openDetail('${i.id}')"><span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(i.subject)}</span><span class="wk-txt">${esc(i.tasks[0]?.text||'')}</span>${personPill(i.person)}<span class="wk-dim">${fmt(i.dueDate)}</span></div>`;}).join('')}${pending.length>8?`<div class="wk-dim" style="text-align:center;padding-top:6px">외 ${pending.length-8}개</div>`:''}</div>`:'';
  return`
<header><div class="hd-row" style="margin-bottom:12px"><div><div class="hd-sub">🏆 성적</div><div class="hd-title">성적 분석</div></div><div class="hd-right">${syncBadge()}</div></div>${statsTabs()}${personFilterBar()}</header>
<div class="screen">
  ${semBar}
  ${summary}
  ${insight}
  <div class="stat-section"><div class="stat-section-title">📚 과목별 누적 점수율 · 목표</div>${subjAll}</div>
  <div class="stat-section"><div class="stat-section-title">📈 점수 추이</div>${subjChips}${trend}</div>
  ${memHtml}
  ${pend}
</div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   화면 설정 (다크모드 / 글자 크기) — 이 기기에만 저장
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const FS_MAP={sm:.9,md:1,lg:1.15,xl:1.3};
function applyPrefs(){
  const dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const r=document.documentElement;
  r.dataset.theme=dark?'dark':'light';
  r.style.setProperty('--fs',FS_MAP[S.fs]||1);
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=dark?'#1B1D2B':'#5B7FFF';
}
function setTheme(v){S.theme=v;try{localStorage.setItem('theme',v);}catch(e){}applyPrefs();render();}
function setFs(v){S.fs=v;try{localStorage.setItem('fs',v);}catch(e){}applyPrefs();render();}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.theme==='auto')applyPrefs();});
applyPrefs();
// 항목별 알림 on/off (가족 전체 기기에 동기화)
function toggleItemAlarm(id){
  const item=S.items.find(i=>i.id===id);if(!item)return;
  const updated={...item,alarmEnabled:!item.alarmEnabled};
  S.items=S.items.map(i=>i.id!==id?i:updated);
  render();
  saveItemFS(updated);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   D-day 배지
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function dBadge(days,allDone,sc){
  if(allDone)return{c:'#4CAF50',t:'완료'};
  if(days===null)return{c:'#9E9E9E',t:'?'};
  if(days<0)return{c:'#9E9E9E',t:'마감'};
  if(days===0)return{c:'#FF5252',t:'오늘!'};
  if(days<=2)return{c:'#FF5252',t:`D-${days}`};
  if(days<=5)return{c:'#FF9800',t:`D-${days}`};
  return{c:sc.accent,t:`D-${days}`};
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   동기화 상태 배지
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
// 인라인 핸들러에 문자열을 넣지 않고 함수로 호출 (따옴표 주입 방지)
function showSyncError(){alert(S.syncError||'오류가 발생했습니다.');}
const APP_VER='v4.5';
function syncBadge(){
  const m={synced:['sync-ok','🟢 동기화'],connecting:['sync-conn','🔄 연결중'],
    offline:['sync-off','📴 오프라인'],error:['sync-err','🔴 오류']};
  const [cls,txt]=m[S.syncStatus]||m.offline;
  return`<span class="sync-badge ${cls}" onclick="${S.syncStatus==='error'?'showSyncError()':''}">${txt}</span><span class="app-ver">${APP_VER}</span>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   웰컴 화면 빌더
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

  <div class="welcome-ico">📚</div>
  <div class="welcome-title">패밀리 플랜 🌹</div>
  <div class="welcome-desc">우리 가족 일정 &amp; 수행평가를 함께 관리해요.<br><b>가족 코드</b>를 입력하면 모든 기기에서<br>같은 데이터를 공유할 수 있어요.</div>
  <div class="welcome-card">
    <div class="f-label">가족 코드</div>
    <input id="fc-input" class="f-input" style="margin-top:6px;font-size:calc(18px*var(--fs));text-align:center;font-weight:800;letter-spacing:1px"
      placeholder="예: 우리가족2025" maxlength="20"
      onkeydown="if(event.key==='Enter')startWithCode()">
    <div class="welcome-hint">가족 모두가 <b>같은 코드</b>를 입력하면<br>실시간으로 데이터가 공유됩니다 🔄<br>새 코드는 <b>8자 이상</b> · 추측하기 쉬운 코드는 안 돼요</div>

  </div>
  ${S.syncStatus==='error'?`<div class="welcome-err">⚠️ ${esc(S.syncError||'오류')}<br><small>Firebase 콘솔 → 데이터베이스 및 스토리지 → Firestore Database를 먼저 활성화해주세요.</small></div>`:''}
</div>`;

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   카드 빌더
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function buildCard(item){
  const sc=getColor(item.subject);
  const days=getDays(item.dueDate);
  const p=pct(item);
  const allDone=item.tasks.length>0&&item.tasks.every(t=>t.done);
  const alarm=item.alarmEnabled&&days!==null&&days>=0&&days<=item.alarmDaysBefore;
  const bd=dBadge(days,allDone,sc);
  const tasks3=item.tasks.slice(0,3);
  const hasAttach=(item.attachments||[]).length>0;
  return`<div class="card" data-id="${item.id}" onclick="openDetail('${item.id}')">
  <div class="card-accent" style="background:${sc.accent}"></div>
  ${alarm?`<div class="alarm-dot">🔔</div>`:''}
  <div class="card-top">
    <div class="card-meta">
      <span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(item.subject)}</span>
      <span class="priority-pip">${PRI_ICON[item.priority||2]}</span>
      ${personPill(item.person)}
    </div>
    <span class="d-badge" style="background:${bd.c}">${bd.t}</span>
  </div>
  <div class="card-date">📅 ${fmt(item.dueDate)}</div>
  <div class="prog-wrap"><div class="prog-bar" style="width:${p}%;background:${sc.accent}"></div></div>
  <div class="prog-lbl">${item.tasks.filter(t=>t.done).length}/${item.tasks.length} 완료</div>
  <div class="task-mini">
    ${tasks3.map(t=>`<div class="task-mini-row" onclick="event.stopPropagation();toggleTask('${item.id}','${t.id}')">
      <span class="mini-cb" style="border-color:${sc.accent};background:${t.done?sc.accent:'white'}">${t.done?'✓':''}</span>
      <span class="mini-txt" style="color:${t.done?'#BBB':'#333'};text-decoration:${t.done?'line-through':'none'}">${esc(t.text)}</span>
    </div>`).join('')}
    ${item.tasks.length>3?`<div class="more-task">+ ${item.tasks.length-3}개 더...</div>`:''}
  </div>
  ${item.earnedScore!==null&&item.earnedScore!==''?`<div class="score-pill" style="background:${sc.accent}">🏆 ${item.earnedScore}/${item.maxScore}점</div>`:''}
  ${hasAttach?`<div class="attach-ind">📎 첨부 ${(item.attachments||[]).length}개</div>`:''}
</div>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   목록 화면
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function buildListView(){
  const all=visItems();
  const active=all.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d>=0&&!i.tasks.every(t=>t.done)});
  const done=all.filter(i=>i.tasks.length>0&&i.tasks.every(t=>t.done));
  const urgent=all.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d<=3&&d>=0&&!i.tasks.every(t=>t.done)});
  let filtered=all;
  if(S.filter==='active')filtered=active;
  if(S.filter==='done')filtered=done;
  if(S.hideDone)filtered=filtered.filter(i=>!(i.tasks.length>0&&i.tasks.every(t=>t.done)));
  filtered=[...filtered].sort((a,b)=>{
    if(S.sortBy==='due')return(getDays(a.dueDate)??999)-(getDays(b.dueDate)??999);
    if(S.sortBy==='subj')return a.subject.localeCompare(b.subject,'ko');
    if(S.sortBy==='score'){const sa=a.earnedScore!==null?a.earnedScore/a.maxScore:-1;const sb=b.earnedScore!==null?b.earnedScore/b.maxScore:-1;return sb-sa;}
    if(S.sortBy==='pri')return(b.priority||2)-(a.priority||2);
    return 0;
  });
  return`
<header>
  <div class="hd-row">
    <div><div class="hd-title">패밀리 플랜</div></div>
    <div class="hd-right">
      ${searchBtn()}${syncBadge()}
      ${notifBtn()}
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-ico">📋</div><span class="stat-val">${all.length}</span><div class="stat-lbl">전체</div></div>
    <div class="stat"><div class="stat-ico">⏳</div><span class="stat-val">${active.length}</span><div class="stat-lbl">진행중</div></div>
    <div class="stat"><div class="stat-ico">✅</div><span class="stat-val">${done.length}</span><div class="stat-lbl">완료</div></div>
    <div class="stat"><div class="stat-ico">🚨</div><span class="stat-val">${urgent.length}</span><div class="stat-lbl">임박</div></div>
  </div>
  <div class="ctrl-bar">
    <button class="filter-btn${S.filter==='all'?' active':''}" onclick="setState({filter:'all'})">전체</button>
    <button class="filter-btn${S.filter==='active'?' active':''}" onclick="setState({filter:'active'})">진행중</button>
    <button class="filter-btn${S.filter==='done'?' active':''}" onclick="setState({filter:'done'})">완료</button>
    <div class="divider-v"></div>
    <button class="sort-btn${S.sortBy==='due'?' active':''}" onclick="setState({sortBy:'due'})">📅 마감순</button>
    <button class="sort-btn${S.sortBy==='subj'?' active':''}" onclick="setState({sortBy:'subj'})">📚 과목순</button>
    <button class="sort-btn${S.sortBy==='score'?' active':''}" onclick="setState({sortBy:'score'})">🏆 점수순</button>

function buildCalView(){
  const y=S.calYear,m=S.calMonth;
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const first=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const ts=todayStr();
  const dm={};visItems().forEach(i=>{if(i.dueDate){if(!dm[i.dueDate])dm[i.dueDate]=[];dm[i.dueDate].push(i);}});
  const gFrom=fmtD(Date.UTC(y,m,1)-7*86400000),gTo=fmtD(Date.UTC(y,m+1,0)+7*86400000);
  const em={};visEvents().flatMap(e=>occurrences(e,gFrom,gTo)).forEach(e=>{
    const sd=e.startDate||e.date;
    const ed=e.endDate||sd;
    if(!sd)return;
    // 정오(T12) 기준 → toISOString 없이 로컬 날짜 직접 읽어 timezone 버그 방지
    let cur=new Date(sd+'T12:00:00');
    const endD=new Date(ed+'T12:00:00');
    while(cur<=endD){
      const ds=cur.getFullYear()+'-'+
        String(cur.getMonth()+1).padStart(2,'0')+'-'+
        String(cur.getDate()).padStart(2,'0');
      if(!em[ds])em[ds]=[];
      if(!em[ds].find(x=>x.id===e.id))em[ds].push(e);
      cur.setDate(cur.getDate()+1);
    }
  });
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell cal-other"><div class="cal-date">${new Date(y,m,1-first+i).getDate()}</div></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const its=dm[ds]||[];const dow=new Date(y,m,d).getDay();
    const isTd=ds===ts;const isSel=S.calDate===ds;
    // 수행평가 칩 (최대 2개)
    const evts_day=em[ds]||[];
    const allChipItems=[
      ...its.map(i=>({nm:i.subject.slice(0,4),color:getColor(i.subject).accent,type:'a'})),
      ...evts_day.map(e=>({nm:e.title.slice(0,4),color:e.color||'#FF6B8A',type:'e'}))
    ];
    const chips=allChipItems.slice(0,2).map(c=>`<div class="${c.type==='a'?'cal-subj-chip':'cal-evt-chip'}" style="background:${c.color}">${c.nm}</div>`).join('');
    const moreChip=allChipItems.length>2?`<div style="font-size:calc(8px*var(--fs));color:#AAA;font-weight:700">+${allChipItems.length-2}</div>`:'';
    const hol=HOL_MAP.get(ds);
    const holChip=hol?`<span class="cal-holi-chip" style="background:${hol.color}">${hol.name}</span>`:'';
    cells+=`<div class="cal-cell${isTd?' cal-today':''}${dow===0?' cal-sun':dow===6?' cal-sat':''}${hol?' holi':''}" onclick="setState({calDate:'${ds}'===S.calDate?null:'${ds}'})">
      <div class="cal-date" style="${isSel&&!isTd?'background:#EEF0FF;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;':''}${hol&&!isTd?'color:'+hol.color+';':''}">${d}</div>
      ${holChip}
      <div class="cal-dots">${chips}${moreChip}</div>
    </div>`;
  }
  const rem=(7-(first+dim)%7)%7;
  for(let i=1;i<=rem;i++)cells+=`<div class="cal-cell cal-other"><div class="cal-date">${i}</div></div>`;
  const selItems=S.calDate?dm[S.calDate]||[]:[];
  const selEvts=S.calDate?em[S.calDate]||[]:[];
  const selHols=S.calDate?(()=>{const h=HOL_MAP.get(S.calDate);return h?[h]:[];})():[];
  const hasPopup=S.calDate&&(selItems.length>0||selEvts.length>0||selHols.length>0);
  const popup=hasPopup?`<div class="cal-popup">
    <div class="cal-popup-title">📅 ${fmt(S.calDate)}</div>
    ${selHols.map(h=>`<div class="cal-holi-popup"><span style="width:10px;height:10px;border-radius:50%;background:${h.color};flex-shrink:0;display:inline-block"></span><span style="font-size:calc(13px*var(--fs));font-weight:800;color:${h.color}">${h.name}</span></div>`).join('')}
    ${selItems.map(item=>{const sc=getColor(item.subject);const bd=dBadge(getDays(item.dueDate),item.tasks.every(t=>t.done),sc);return`<div class="cal-popup-item" onclick="openDetail('${item.id}')"><span style="width:8px;height:8px;border-radius:50%;background:${sc.accent};flex-shrink:0;display:inline-block"></span><span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(item.subject)}</span><span style="font-size:calc(13px*var(--fs));font-weight:600;flex:1">${esc(item.subject)}</span><span class="d-badge" style="background:${bd.c}">${bd.t}</span></div>`;}).join('')}
    ${selEvts.map(ev=>{const ci=evtCatInfo(ev.category||'일반');return`<div class="cal-popup-item" onclick="openEvtDetail('${ev.id}','${ev.startDate||ev.date}')"><span style="width:8px;height:8px;border-radius:50%;background:${ev.color||ci[2]};flex-shrink:0;display:inline-block"></span><span class="evt-cat" style="background:${(ev.color||ci[2])}22;color:${ev.color||ci[2]}">${ci[0]} ${ev.category||'일반'}</span><span style="font-size:calc(13px*var(--fs));font-weight:600;flex:1">${esc(ev.title)}</span>${ev.person?`<span class="evt-person" style="background:${ev.color||ci[2]};font-size:calc(10px*var(--fs))">${esc(ev.person)}</span>`:''}</div>`;}).join('')}
  </div>`:'';;
  return`
<header>
  <div class="hd-row" style="margin-bottom:12px">
    <div><div class="hd-title" style="display:flex;align-items:center;gap:7px"><svg class="nav-svg" width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="17" rx="3" fill="#5B7FFF" fill-opacity=".18" stroke="#5B7FFF" stroke-width="1.8"/><rect x="2" y="9" width="20" height="3.2" fill="#5B7FFF" fill-opacity=".35"/><line x1="7.5" y1="2" x2="7.5" y2="7" stroke="#5B7FFF" stroke-width="2.3" stroke-linecap="round"/><line x1="16.5" y1="2" x2="16.5" y2="7" stroke="#5B7FFF" stroke-width="2.3" stroke-linecap="round"/><circle cx="7.5" cy="16.5" r="1.4" fill="#5B7FFF"/><circle cx="12" cy="16.5" r="1.4" fill="#5B7FFF"/><circle cx="16.5" cy="16.5" r="1.4" fill="#5B7FFF"/></svg><span>달력</span></div></div>
    <div class="hd-right">${searchBtn()}${syncBadge()}</div>
  </div>
  <div style="text-align:center;padding-bottom:8px">
    <span style="font-size:calc(16px*var(--fs));font-weight:800;color:var(--text)">${y}년 ${mn[m]}</span>
  </div>
  ${personFilterBar()}
</header>
<div class="screen">
  <div class="cal-wrap" id="cal-wrap"
    ontouchstart="calTouchStart(event)"
    ontouchend="calTouchEnd(event)">
    <div class="cal-weekdays">${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-wd">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    ${popup}
  </div>
</div>
<button class="fab" ${fabGetStyle()} ontouchstart="fabDown(event,'openAdd')" onmousedown="fabDown(event,'openAdd')">+</button>`;
}


function buildStatsView(){
  if(S.statsView==='score')return buildScoreView();
  const ITEMS=visItems();
  const scored=ITEMS.filter(i=>i.earnedScore!==null&&i.earnedScore!=='');
  const avg=scored.length>0?Math.round(scored.reduce((a,i)=>a+(i.earnedScore/i.maxScore*100),0)/scored.length):null;
  const tot=ITEMS.reduce((a,i)=>a+i.tasks.length,0);
  const dn=ITEMS.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
  const cr=tot>0?Math.round(dn/tot*100):0;

  // 과목별 점수율
  const scoreChart=scored.length===0
    ?`<div class="no-data">📊 점수가 입력된 수행평가가 없어요</div>`
    :scored.map(item=>{
      const p=Math.round(item.earnedScore/item.maxScore*100);
      const sc=getColor(item.subject);
      return`<div class="score-bar-row"><div class="score-bar-label">${esc(item.subject)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${p}%;background:${sc.accent}">${p}%</div></div><div class="score-bar-val">${item.earnedScore}/${item.maxScore}</div></div>`;
    }).join('');

  // 완료율 추이
  const hist=S.trend.slice(-14);
  let trendChart;
  if(hist.length<2){
    trendChart=`<div class="no-data">📈 데이터 수집 중이에요<br><small style="color:#BBB">체크리스트를 체크하면 기록됩니다</small></div>`;
  }else{
    const W=300,H=100,P=8;
    const pts=hist.map((h,i)=>({x:P+(i/(hist.length-1))*(W-P*2),y:H-P-(h.pct/100)*(H-P*2),pct:h.pct,date:h.date}));
    const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const area=`M${pts[0].x.toFixed(1)},${H} ${pts.map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} L${pts[pts.length-1].x.toFixed(1)},${H} Z`;
    const labs=pts.filter((_,i)=>i===0||i===pts.length-1||i===Math.floor(pts.length/2));
    trendChart=`<svg viewBox="0 0 ${W} ${H+20}" class="chart-svg" style="height:${H+20}px"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5B7FFF" stop-opacity=".3"/><stop offset="100%" stop-color="#5B7FFF" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#tg)"/><polyline points="${poly}" fill="none" stroke="#5B7FFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#5B7FFF"/><text x="${p.x.toFixed(1)}" y="${(p.y-7).toFixed(1)}" text-anchor="middle" font-size="9" fill="#5B7FFF" font-weight="700">${p.pct}%</text>`).join('')}${labs.map(p=>`<text x="${p.x.toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="9" fill="#AAA">${p.date.slice(5)}</text>`).join('')}</svg>`;
  }

  // 과목별 진행률
  const subjComp=SUBJECTS.map(sub=>{
    const si=ITEMS.filter(i=>i.subject===sub.name);
    if(!si.length)return null;
    const t=si.reduce((a,i)=>a+i.tasks.length,0);
    const d=si.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
    return{name:sub.name,pct:t>0?Math.round(d/t*100):0,accent:sub.accent,count:si.length};
  }).filter(Boolean);

  // 구성원별 진행률 (필터 해제 상태일 때만)
  const memComp=S.personFilter?[]:S.members.map(m=>{
    const si=S.items.filter(i=>i.person===m.name);
    if(!si.length)return null;
    const t=si.reduce((a,i)=>a+i.tasks.length,0);
    const d=si.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
    return{name:m.name,pct:t>0?Math.round(d/t*100):0,accent:m.color,count:si.length};
  }).filter(Boolean);

  return`

<div class="screen">
