    <div class="sum-card"><div class="sum-val" style="color:var(--p)">${ITEMS.length}</div><div class="sum-lbl">전체</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--ok)">${cr}%</div><div class="sum-lbl">전체 완료율</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#FF9800">${avg!==null?avg+'%':'--'}</div><div class="sum-lbl">평균 점수율</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--danger)">${ITEMS.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d<=3&&d>=0}).length}</div><div class="sum-lbl">마감임박 3일</div></div>
  </div>
  ${memComp.length>0?`<div class="stat-section"><div class="stat-section-title">👥 구성원별 진행률</div>${memComp.map(sc=>`<div class="score-bar-row"><div class="score-bar-label">${esc(sc.name)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${sc.pct}%;background:${sc.accent}">${sc.pct}%</div></div><div class="score-bar-val" style="color:${sc.accent}">${sc.count}개</div></div>`).join('')}</div>`:''}
  ${subjComp.length>0?`<div class="stat-section"><div class="stat-section-title">📚 과목별 진행률</div>${subjComp.map(sc=>`<div class="score-bar-row"><div class="score-bar-label">${esc(sc.name)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${sc.pct}%;background:${sc.accent}">${sc.pct}%</div></div><div class="score-bar-val" style="color:${sc.accent}">${sc.count}개</div></div>`).join('')}</div>`:''}
  <div class="stat-section"><div class="stat-section-title">🏆 과목별 점수율</div>${scoreChart}</div>

function openEvtDetail(id,date){S.evtOverlay='detail';S.activeEvtId=id;S.activeEvtDate=date||null;renderEvtOverlay();}
function openEvtAdd(){
  S.evtForm={title:'',startDate:todayStr(),endDate:todayStr(),allDay:true,startTime:'',endTime:'',category:'일반',person:S.personFilter||'',color:'#FF6B8A',memo:''};
  S.evtOverlay='form';renderEvtOverlay();
}
function openEvtEdit(id){
  const ev=S.events.find(e=>e.id===id);if(!ev)return;
  S.evtForm={...ev,startDate:ev.startDate||ev.date,endDate:ev.endDate||ev.startDate||ev.date};S.evtOverlay='form';renderEvtOverlay();
}
function closeEvtOverlay(){
  const ov=document.getElementById('evt-ov');
  if(ov){ov.classList.remove('open');setTimeout(()=>{S.evtOverlay=null;S.activeEvtId=null;S.evtForm=null;const el=document.getElementById('evt-ov');if(el)el.remove();},280);}
  else{S.evtOverlay=null;S.activeEvtId=null;S.evtForm=null;}
}
function renderEvtOverlay(){
  let old=document.getElementById('evt-ov');if(old)old.remove();
  if(!S.evtOverlay)return;
  const div=document.createElement('div');div.className='overlay';div.id='evt-ov';
  div.onclick=e=>{if(e.target===div)closeEvtOverlay();};
  let inner='';
  if(S.evtOverlay==='detail'){
    const base=S.events.find(e=>e.id===S.activeEvtId);
    const ev=base&&base.repeat&&S.activeEvtDate?(occurrences(base,S.activeEvtDate,S.activeEvtDate)[0]||base):base; // 탭한 회차 기준으로 표시
    if(ev)inner=buildEvtDetailSheet(ev);
  }
  else if(S.evtOverlay==='form')inner=buildEvtFormSheet();
  div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${inner}</div>`;
  document.body.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('open')));
}
function togEvtAllday(checked){
  S.evtForm.allDay=checked;
  const row=document.getElementById('ef-time-row');if(row)row.style.display=checked?'none':'flex';
}
function setEvtCat(cat){
  S.evtForm.category=cat;
  document.querySelectorAll('#ef-cats > div').forEach(d=>{
    const c=EVT_CATS.find(x=>x[1]===cat);
    const isSel=d.textContent.includes(cat);
    d.style.borderColor=isSel?(c?c[2]:'var(--p)'):'#DDD';
    d.style.background=isSel?(c?c[2]+'22':'var(--p-light)'):'#fff';
    d.style.color=isSel?(c?c[2]:'var(--p)'):'#888';
  });
}
// 색상 변경 시 전체 재렌더되므로 입력 중이던 값을 먼저 보존
function syncEvtFormFromDOM(){
  const g=id=>document.getElementById(id);
  const f=S.evtForm;
  if(g('ef-title'))f.title=g('ef-title').value;
  if(g('ef-start-date'))f.startDate=g('ef-start-date').value;

  if(g('ef-repeat'))f.repeat=g('ef-repeat').value;
  if(g('ef-until'))f.repeatUntil=g('ef-until').value;
}
function setEvtColor(c){
  syncEvtFormFromDOM();
  S.evtForm.color=c;
  const sb=document.getElementById('ef-save');if(sb)sb.style.background=c;
  document.querySelectorAll('#ef-save').forEach(b=>b.style.background=c);
  // dot border 업데이트
  renderEvtOverlay();

function saveEvtForm(){
  const title=document.getElementById('ef-title')?.value?.trim();
  const startDate=document.getElementById('ef-start-date')?.value;
  const endDate=document.getElementById('ef-end-date')?.value||startDate;
  if(!title){alert('제목을 입력하세요.');return;}
  if(!startDate){alert('시작일을 선택하세요.');return;}
  if(endDate&&endDate<startDate){alert('종료일은 시작일 이후여야 합니다.');return;}
  const allDay=document.getElementById('ef-allday')?.checked!==false;
  const repeat=document.getElementById('ef-repeat')?.value||'';
  const until=document.getElementById('ef-until')?.value||'';
  if(repeat&&until&&until<startDate){alert('반복 종료일은 시작일 이후여야 합니다.');return;}
  const ev={
    id:S.evtForm.id||uid(),
    title,
    startDate,endDate:endDate||startDate,
    date:startDate,
    allDay,
    startTime:allDay?'':(document.getElementById('ef-start')?.value||''),
    endTime:allDay?'':(document.getElementById('ef-end')?.value||''),
    category:S.evtForm.category||'일반',
    person:document.getElementById('ef-person')?.value?.trim()||'',
    color:S.evtForm.color||'#FF6B8A',
    memo:document.getElementById('ef-memo')?.value?.trim()||'',
    repeat,repeatUntil:repeat?until:'',
    exdates:repeat?(S.evtForm.exdates||[]):[],
    createdAt:S.evtForm.createdAt||Date.now(),
  };
  if(S.evtForm.id) S.events=S.events.map(e=>e.id===S.evtForm.id?ev:e);
  else S.events=[ev,...S.events];
  closeEvtOverlay();
  render();
  saveEventFS(ev);
}
function deleteEvt(id,date){
  const ev0=S.events.find(e=>e.id===id);if(!ev0)return;
  if(ev0.repeat){
    // 반복 일정: 이 날짜만 / 전체 중 선택
    if(date&&confirm(`반복 일정이에요.\n${fmt(date)} 하루만 삭제할까요?\n\n확인 = 이 날짜만 삭제\n취소 = 다음 단계`)){
      const upd={...ev0,exdates:[...(ev0.exdates||[]),date]};
      S.events=S.events.map(e=>e.id===id?upd:e);
      closeEvtOverlay();render();saveEventFS(upd);return;
    }
    if(!confirm('반복 일정 전체를 삭제할까요?'))return;
  }else if(!confirm('일정을 삭제할까요?'))return;
  S.events=S.events.filter(e=>e.id!==id);

function openGuideDetail(subjectId, taskIdx){
  GS.subjectId=subjectId; GS.taskIdx=taskIdx;
  renderGuideSheet();
}

function renderGuideSheet(){
  let old=document.getElementById('guide-ov');if(old)old.remove();
  const div=document.createElement('div');div.className='overlay';div.id='guide-ov';
  div.onclick=e=>{if(e.target===div)closeGuideSheet()};
  if(GS.subjectId==='common'){
    div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${buildCommonGuide()}</div>`;
  } else {
    const sub=GUIDE_SUBJECTS.find(s=>s.id===GS.subjectId);
    if(!sub)return;
    div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${buildSubjectGuide(sub)}</div>`;
  }
  document.body.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('open')));
}

function closeGuideSheet(){
  const ov=document.getElementById('guide-ov');
  if(ov){ov.classList.remove('open');setTimeout(()=>ov.remove(),280);}
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function buildDetailSheet(item){
  const sc=getColor(item.subject);
  const days=getDays(item.dueDate);
  const p=pct(item);
  const allDone=item.tasks.length>0&&item.tasks.every(t=>t.done);
  const bd=dBadge(days,allDone,sc);
  const sn=item.earnedScore!==null&&item.earnedScore!==''?Number(item.earnedScore):null;
  const sp=sn!==null?Math.round(sn/item.maxScore*100):null;
  const atts=item.attachments||[];
  return`<div class="drag-handle"></div>

<div class="det-accent" style="background:linear-gradient(90deg,${sc.accent},${sc.accent}66)"></div>
<div class="det-top">
  <span class="subj-tag-lg" style="background:${sc.tag};color:${sc.accent}">${esc(item.subject)}</span>
  <span class="d-badge-lg" style="background:${bd.c}">${bd.t}</span>
  <span style="font-size:calc(15px*var(--fs))">${PRI_ICON[item.priority||2]}</span>
  ${personPill(item.person)}
</div>
<div class="det-date">📅 제출일: ${fmt(item.dueDate)}</div>
${item.alarmEnabled?`<div class="det-alarm">🔔 ${item.alarmDaysBefore}일 전 알림</div>`:''}
${item.memo?`<div class="det-memo">📌 ${esc(item.memo)}</div>`:''}
<div class="det-sec">진행 상황</div>
<div class="prog-lg-hd"><span style="font-size:calc(12px*var(--fs));font-weight:700;color:#555">완료율</span><span style="font-size:calc(13px*var(--fs));font-weight:900;color:${sc.accent}">${p}%</span></div>
<div class="prog-lg-wrap"><div class="prog-lg-bar" style="width:${p}%;background:${sc.accent}"></div></div>
<div class="det-sec">수행 내용</div>
<div class="task-list">
  ${item.tasks.length===0?'<p style="font-size:calc(12px*var(--fs));color:#AAA">등록된 내용이 없습니다.</p>':''}
  ${item.tasks.map((t,i)=>`<div class="task-row" onclick="toggleTask('${item.id}','${t.id}')">
    <span class="t-num">${i+1}</span>
    <span class="cb-lg" style="border-color:${sc.accent};background:${t.done?sc.accent:'white'}">${t.done?'✓':''}</span>
    <span class="t-txt" style="color:${t.done?'#BBB':'#222'};text-decoration:${t.done?'line-through':'none'}">${esc(t.text)}</span>
  </div>`).join('')}
</div>
<div class="det-sec">평가 점수</div>
<div class="score-row">
  <input type="number" class="score-in" id="score-in" min="0" max="${item.maxScore}"
    value="${sn!==null?sn:''}" placeholder="점수"
    onchange="saveScore('${item.id}',this.value)" oninput="updScorePct(this,${item.maxScore})">
  <span style="font-size:calc(13px*var(--fs));color:#555;font-weight:600"> / ${item.maxScore}점</span>
  <span class="score-pct" id="score-pct" style="background:${sc.accent};display:${sp!==null?'inline-block':'none'}">${sp!==null?sp+'%':''}</span>
</div>
<div class="det-sec">첨부 파일 <span style="font-weight:400;color:#BBB;font-size:calc(9px*var(--fs))">(이미지는 가족과 동기화 · 최대 ${MAX_IMG}장)</span></div>
${atts.some(a=>a.type==='img'&&!a.cloud)?`<div class="attach-local-note">📱 표시된 이미지는 이 기기에만 있어요 → 설정 › 이미지 공유에서 가족과 공유할 수 있어요</div>`:''}
<div class="attach-grid">
  ${atts.map(a=>a.type==='img'?(a.cloud
    ?`<div class="attach-card" onclick="viewCloudImg('${item.id}','${a.id}')"><img src="${a.thumb||''}" alt="${esc(a.name)}"><div class="attach-rm" onclick="event.stopPropagation();removeAttach('${item.id}','${a.id}')">✕</div></div>`
    :`<div class="attach-card" onclick="viewImg('${esc(a.data)}')"><img src="${a.data}" alt="${esc(a.name)}"><span class="attach-local">📱</span><div class="attach-rm" onclick="event.stopPropagation();removeAttach('${item.id}','${a.id}')">✕</div></div>`):
    `<div class="attach-txt-card"><div class="attach-txt-preview">${esc(a.data)}</div><div class="attach-rm" onclick="removeAttach('${item.id}','${a.id}')">✕</div></div>`
  ).join('')}
  ${atts.filter(a=>a.type==='img').length<MAX_IMG?`<div class="attach-add-btn" onclick="openAttach('${item.id}')"><span>📎</span><span>이미지</span></div>`:''}
  <div class="attach-add-btn" onclick="openTxtAttach('${item.id}')"><span>📝</span><span>텍스트</span></div>
</div>
<div class="act-row" style="margin-top:14px">
  <button class="act-btn" style="background:${sc.accent}" onclick="openEdit('${item.id}')">✏️ 수정</button>
  <button class="act-btn" style="background:#607D8B" onclick="shareItem('${item.id}')">📤 공유</button>
  <button class="act-btn" style="background:var(--danger)" onclick="deleteItem('${item.id}')">🗑️ 삭제</button>
</div>
<div class="act-row" style="margin-top:8px">
  <button class="act-btn" style="background:${item.alarmEnabled?'#FF9800':'#9E9E9E'}" onclick="toggleItemAlarm('${item.id}')">${item.alarmEnabled?'🔔 알림 켜짐':'🔕 알림 꺼짐'}</button>
  <button class="act-btn" style="background:#26A69A" onclick="exportItemICS('${item.id}')">🗓️ 캘린더 추가</button>
</div>`;
}

// 실시간 동기화로 갱신될 때 열려 있는 수행평가 폼의 입력값 보존
function renderKeep(){
  if(S.overlay==='form'&&S.form&&document.getElementById('f-subj'))syncFormFromDOM();
  render();
}
function render(){
  try{
  // 가족 코드 없으면 웰컴 화면
  if(!S.familyCode){document.getElementById('app').innerHTML=buildWelcome();return;}
  if(KIOSK){document.getElementById('app').innerHTML=buildWallView();return;}
  const scrollTop=document.querySelector('.screen')?.scrollTop||0;
  let main='';
  if(S.tab==='list')main=subSeg(S.lsSub,'setLsSub',[['list','📋 목록'],['stats','📊 통계·성적']])(S.lsSub==='stats'?buildStatsView():buildListView());
  else if(S.tab==='events')main=subSeg(S.evSub,'setEvSub',[['cal','🗓 달력'],['list','🗒 일정 목록']])(S.evSub==='list'?buildEventsView():buildCalView());
  else if(S.tab==='stamp')main=buildStampView();
  else if(S.tab==='guide')main=buildGuideView();
  else if(S.tab==='backup')main=buildBackupView();
  let ov='';
  if(S.overlay==='detail'){const item=S.items.find(i=>i.id===S.activeId);if(item)ov=`<div class="overlay" id="ov" onclick="bgClick(event)"><div class="sheet" onclick="event.stopPropagation()">${buildDetailSheet(item)}</div></div>`;}
  else if(S.overlay==='form')ov=`<div class="overlay" id="ov" onclick="bgClick(event)"><div class="sheet" onclick="event.stopPropagation()">${buildFormSheet()}</div></div>`;
  else if(S.overlay==='txt-attach')ov=`<div class="overlay" id="ov" onclick="bgClick(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="drag-handle"></div><div class="form-title" style="font-size:calc(16px*var(--fs))">📝 텍스트 메모 추가</div><textarea class="f-input" id="txt-area" placeholder="참고 내용, 필기 메모 등..." style="min-height:120px;resize:vertical"></textarea><div class="form-btns" style="margin-top:12px"><button class="cancel-btn" onclick="closeOverlay()">취소</button><button class="save-btn" style="background:var(--p)" onclick="saveTxtAttach()">추가하기</button></div></div></div>`;
  else if(S.overlay==='prep')ov=`<div class="overlay" id="ov" onclick="bgClick(event)"><div class="sheet" onclick="event.stopPropagation()">${buildPrepSheet()}</div></div>`;

function uploadImage(doc){
  imgCol().doc(doc.id).set(doc).catch(err=>{
    alert('이미지 업로드 실패: '+err.message+'\n(Firestore 규칙 최신본이 게시됐는지 확인해 주세요)');
    const it=S.items.find(i=>i.id===doc.itemId);if(!it)return;

  });

document.getElementById('attach-file').addEventListener('change',async e=>{
  const id=S.attachTargetId;
  const files=Array.from(e.target.files);e.target.value='';
  if(!id||!files.length)return;
  const base=S.items.find(i=>i.id===id);if(!base)return;
  let imgCount=(base.attachments||[]).filter(a=>a.type==='img').length;
  const added=[];
  for(const file of files){
    if(file.type.startsWith('image/')){
      if(imgCount>=MAX_IMG){alert(`이미지는 수행평가당 최대 ${MAX_IMG}장까지 첨부할 수 있어요.`);break;}
      try{
        const {data,thumb}=await makeCloudImage(file);
        const aid=uid();
        uploadImage({id:aid,itemId:id,data,createdAt:Date.now()});
        added.push({id:aid,type:'img',name:file.name.slice(0,40),thumb,cloud:true});
        imgCount++;
      }catch(err){alert('이미지를 처리하지 못했어요: '+err.message);}
    }else{
      const text=await file.text();
      added.push({id:uid(),type:'txt',name:file.name,data:text.slice(0,500)});
    }
  }
  const item=S.items.find(i=>i.id===id);if(!item||!added.length)return; // 처리 중 변경된 최신 상태 기준
  const updated={...item,attachments:[...(item.attachments||[]),...added]};
  S.items=S.items.map(i=>i.id!==id?i:updated);
  setState({overlay:'detail',activeId:id});
  saveItemFS(updated);
});
function imgFrom(src){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('읽을 수 없는 이미지예요'));img.src=src;});
}
function drawScaled(img,mw,mh,q){
  const r=Math.min(1,mw/img.width,mh/img.height),w=Math.max(1,Math.round(img.width*r)),h=Math.max(1,Math.round(img.height*r));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h); // 투명 PNG는 흰 배경
  return c.toDataURL('image/jpeg',q);
}
// 원본(≤1000px, Firestore 문서 한도를 넘지 않게 단계적 압축) + 썸네일(160px)
async function makeCloudImage(file){
  const u=URL.createObjectURL(file);
  try{
    const img=await imgFrom(u);
    let data=drawScaled(img,1000,1000,.72);
    if(data.length>450000)data=drawScaled(img,800,800,.6);
    if(data.length>450000)data=drawScaled(img,640,640,.5);
    return{data,thumb:drawScaled(img,160,160,.6)};
  }finally{URL.revokeObjectURL(u);}
}
// 이전 버전에서 이 기기에만 저장된 이미지 → 가족과 공유
function localImgInfo(){
  const ids=[];let n=0;
  for(let k=0;k<localStorage.length;k++){
    const key=localStorage.key(k);
    if(key&&key.startsWith('img_')){
      const id=key.slice(4),l=legacyImgs(id);
      if(l.length&&S.items.some(i=>i.id===id)){n+=l.length;ids.push(id);}
    }
  }
  return{n,ids};
}
async function migrateLocalImages(){
  const {n,ids}=localImgInfo();
  if(!n){alert('공유할 이미지가 없어요.');return;}
  if(!confirm(`이 기기에만 저장된 이미지 ${n}장을 가족과 공유할까요?\n(수행평가당 최대 ${MAX_IMG}장, 업로드 후 이 기기의 로컬 사본은 삭제돼요)`))return;
  let ok=0,fail=0;
  for(const id of ids){
    const item=S.items.find(i=>i.id===id);if(!item)continue;
    const legacy=legacyImgs(id);
    const room=Math.max(0,MAX_IMG-(item.attachments||[]).filter(a=>a.type==='img'&&a.cloud).length);
    const metas=[],done=new Set();
    for(const a of legacy.slice(0,room)){
      try{
        const img=await imgFrom(a.data);
        const data=a.data.length>450000?drawScaled(img,800,800,.6):a.data;
        const thumb=drawScaled(img,160,160,.6);
        // 서버 확정을 기다림(15초 제한) — 실패 시 로컬 사본 유지
        await Promise.race([imgCol().doc(a.id).set({id:a.id,itemId:id,data,createdAt:Date.now()}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과')),15000))]);
        metas.push({id:a.id,type:'img',name:(a.name||'image').slice(0,40),thumb,cloud:true});done.add(a.id);ok++;
      }catch(err){fail++;}
    }
    fail+=Math.max(0,legacy.length-room); // 한도 초과분
    if(metas.length){
      const latest=S.items.find(i=>i.id===id)||item;
      await saveItemFS({...latest,attachments:[...(latest.attachments||[]).filter(a=>!done.has(a.id)),...metas]}).catch(()=>{});
    }
    const rest=legacy.filter(a=>!done.has(a.id));
    if(rest.length)localStorage.setItem('img_'+id,JSON.stringify(rest));else localStorage.removeItem('img_'+id);
    // 메모리 상의 목록에서도 공유 완료된 로컬 사본 제거
    S.items=S.items.map(i=>i.id!==id?i:{...i,attachments:(i.attachments||[]).filter(a=>a.cloud||a.type!=='img').concat(rest)});
  }
  render();
  alert(`✅ ${ok}장 공유 완료${fail?`\n⚠️ ${fail}장은 공유하지 못해 이 기기에 남아 있어요`:''}`);
}

  const score=document.getElementById('f-score')?.value;

  const alarmDays=Number(document.getElementById('f-alarm-days')?.value||3);
  if(!subj){alert('과목을 입력하세요.');return}
  if(!date){alert('제출일을 입력하세요.');return}
  const clean=S.form.tasks.filter(t=>t.text.trim());
  if(!clean.length){alert('수행 내용을 하나 이상 입력하세요.');return}
  const existing=S.form.id?S.items.find(i=>i.id===S.form.id):null;
  const newItem={
    id:S.form.id||uid(),subject:subj,dueDate:date,tasks:clean,
    maxScore:Number(score)||20,earnedScore:existing?.earnedScore??null,
    alarmDaysBefore:alarmDays,alarmEnabled:S.form.alarmEnabled,memo,
    priority:S.form.priority||2,
    person:S.form.person||'',
    attachments:existing?.attachments||[],
    createdAt:existing?.createdAt||Date.now(),
  };
  // 낙관적 업데이트
  if(S.form.id) S.items=S.items.map(i=>i.id===S.form.id?newItem:i);
  else S.items=[newItem,...S.items];
  setState({overlay:null,activeId:null,form:null});
  saveItemFS(newItem); // Firestore에 저장
}

// Firestore 배치는 500건 제한 → 400건씩 나눠 커밋
async function batchWrite(ops,size=400){
  for(let i=0;i<ops.length;i+=size){
    const b=db.batch();
    ops.slice(i,i+size).forEach(op=>op(b));
    await b.commit();
  }
}

function fabDown(e,act){
  e.stopPropagation();
  if(e.cancelable)e.preventDefault();
  const el=e.currentTarget;
  const pt=e.touches?e.touches[0]:e;
  const sx=pt.clientX,sy=pt.clientY;
  const rect=el.getBoundingClientRect();
  const ox=sx-rect.left,oy=sy-rect.top;
  let drag=false;
  // 길게 누르기 감지 (480ms)
  const tm=setTimeout(()=>{
    drag=true;
    el.style.opacity='.75';
    el.style.transform='scale(1.15)';
    el.style.transition='none';
    el.style.zIndex='999';
    // 진동 피드백 (지원 기기)
    if(navigator.vibrate)navigator.vibrate(30);
  },480);
  function mv(ev){
    const p=ev.touches?ev.touches[0]:ev;
    if(!drag){
      if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10)clearTimeout(tm);
      return;
    }
    if(ev.cancelable)ev.preventDefault();
    el.style.left=(p.clientX-ox)+'px';
    el.style.top=(p.clientY-oy)+'px';
    el.style.right='auto';
    el.style.bottom='auto';
  }
  function up(){
    clearTimeout(tm);
    document.removeEventListener('touchmove',mv,{passive:false});
    document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',mv);
    document.removeEventListener('mouseup',up);
    if(drag){
      el.style.opacity='1';
      el.style.transform='scale(1)';
      el.style.transition='transform .15s';
      setTimeout(()=>el.style.transition='',200);
      const nr=el.getBoundingClientRect();
      // 화면 경계 안으로 제한
      const nx=Math.max(10,Math.min(window.innerWidth-62,nr.left));
      const ny=Math.max(10,Math.min(window.innerHeight-66,nr.top));
      el.style.left=nx+'px';
      el.style.top=ny+'px';
      _saveFP(nx,ny);
    }else{
      el.style.opacity='1';
      el.style.transform='';
      window[act]();
    }
  }
  document.addEventListener('touchmove',mv,{passive:false});
  document.addEventListener('touchend',up);
  document.addEventListener('mousemove',mv);
  document.addEventListener('mouseup',up);
}
