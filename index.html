function buildCalView(){
  const y=S.calYear,m=S.calMonth;
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const first=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const ts=todayStr();
  const dm={};S.items.forEach(i=>{if(i.dueDate){if(!dm[i.dueDate])dm[i.dueDate]=[];dm[i.dueDate].push(i);}});
  const em={};S.events.forEach(e=>{
    const sd=e.startDate||e.date;
    const ed=e.endDate||sd;
    if(!sd)return;
    // 정오(T12) 기준 → toISOString 없이 로컬 날짜 직접 읽어 timezone 버그 방지
    let cur=new Date(sd+'T12:00:00');
    const endD=new Date(ed+'T12:00:00');
    while(cur<=endD){
      const ds=cur.getFullYear()+'-'+
        String(cur.getMonth()+1).padStart(2,'0')+'-'+
        String(cur.getDate()).padStart(2,'0');
      if(!em[ds])em[ds]=[];
      if(!em[ds].find(x=>x.id===e.id))em[ds].push(e);
      cur.setDate(cur.getDate()+1);
    }
  });
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell cal-other"><div class="cal-date">${new Date(y,m,1-first+i).getDate()}</div></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const its=dm[ds]||[];const dow=new Date(y,m,d).getDay();
    const isTd=ds===ts;const isSel=S.calDate===ds;
    // 수행평가 칩 (최대 2개)
    const evts_day=em[ds]||[];
    const allChipItems=[
      ...its.map(i=>({nm:i.subject.slice(0,4),color:getColor(i.subject).accent,type:'a'})),
      ...evts_day.map(e=>({nm:e.title.slice(0,4),color:e.color||'#FF6B8A',type:'e'}))
    ];
    const chips=allChipItems.slice(0,2).map(c=>`<div class="${c.type==='a'?'cal-subj-chip':'cal-evt-chip'}" style="background:${c.color}">${c.nm}</div>`).join('');
    const moreChip=allChipItems.length>2?`<div style="font-size:8px;color:#AAA;font-weight:700">+${allChipItems.length-2}</div>`:'';
    const hol=HOL_MAP.get(ds);
    const holChip=hol?`<span class="cal-holi-chip" style="background:${hol.color}">${hol.name}</span>`:'';
    cells+=`<div class="cal-cell${isTd?' cal-today':''}${dow===0?' cal-sun':dow===6?' cal-sat':''}${hol?' holi':''}" onclick="setState({calDate:'${ds}'===S.calDate?null:'${ds}'})">
      <div class="cal-date" style="${isSel&&!isTd?'background:#EEF0FF;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;':''}${hol&&!isTd?'color:'+hol.color+';':''}">${d}</div>
      ${holChip}
      <div class="cal-dots">${chips}${moreChip}</div>
    </div>`;
  }
  const rem=(7-(first+dim)%7)%7;
  for(let i=1;i<=rem;i++)cells+=`<div class="cal-cell cal-other"><div class="cal-date">${i}</div></div>`;
  const selItems=S.calDate?dm[S.calDate]||[]:[];
  const selEvts=S.calDate?em[S.calDate]||[]:[];
  const selHols=S.calDate?(()=>{const h=HOL_MAP.get(S.calDate);return h?[h]:[];})():[];
  const hasPopup=S.calDate&&(selItems.length>0||selEvts.length>0||selHols.length>0);
  const popup=hasPopup?`<div class="cal-popup">
    <div class="cal-popup-title">📅 ${fmt(S.calDate)}</div>
    ${selHols.map(h=>`<div class="cal-holi-popup"><span style="width:10px;height:10px;border-radius:50%;background:${h.color};flex-shrink:0;display:inline-block"></span><span style="font-size:13px;font-weight:800;color:${h.color}">${h.name}</span></div>`).join('')}
    ${selItems.map(item=>{const sc=getColor(item.subject);const bd=dBadge(getDays(item.dueDate),item.tasks.every(t=>t.done),sc);return`<div class="cal-popup-item" onclick="openDetail('${item.id}')"><span style="width:8px;height:8px;border-radius:50%;background:${sc.accent};flex-shrink:0;display:inline-block"></span><span class="subj-tag" style="background:${sc.tag};color:${sc.accent}">${esc(item.subject)}</span><span style="font-size:13px;font-weight:600;flex:1">${esc(item.subject)}</span><span class="d-badge" style="background:${bd.c}">${bd.t}</span></div>`;}).join('')}
    ${selEvts.map(ev=>{const ci=evtCatInfo(ev.category||'일반');return`<div class="cal-popup-item" onclick="openEvtDetail('${ev.id}')"><span style="width:8px;height:8px;border-radius:50%;background:${ev.color||ci[2]};flex-shrink:0;display:inline-block"></span><span class="evt-cat" style="background:${(ev.color||ci[2])}22;color:${ev.color||ci[2]}">${ci[0]} ${ev.category||'일반'}</span><span style="font-size:13px;font-weight:600;flex:1">${esc(ev.title)}</span>${ev.person?`<span class="evt-person" style="background:${ev.color||ci[2]};font-size:10px">${esc(ev.person)}</span>`:''}</div>`;}).join('')}
  </div>`:'';;
  return`
<header>
  <div class="hd-row" style="margin-bottom:12px">
    <div><div class="hd-title" style="display:flex;align-items:center;gap:7px"><svg class="nav-svg" width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="17" rx="3" fill="#5B7FFF" fill-opacity=".18" stroke="#5B7FFF" stroke-width="1.8"/><rect x="2" y="9" width="20" height="3.2" fill="#5B7FFF" fill-opacity=".35"/><line x1="7.5" y1="2" x2="7.5" y2="7" stroke="#5B7FFF" stroke-width="2.3" stroke-linecap="round"/><line x1="16.5" y1="2" x2="16.5" y2="7" stroke="#5B7FFF" stroke-width="2.3" stroke-linecap="round"/><circle cx="7.5" cy="16.5" r="1.4" fill="#5B7FFF"/><circle cx="12" cy="16.5" r="1.4" fill="#5B7FFF"/><circle cx="16.5" cy="16.5" r="1.4" fill="#5B7FFF"/></svg><span>달력</span></div></div>
    <div class="hd-right">${syncBadge()}</div>
  </div>
  <div style="text-align:center;padding-bottom:8px">
    <span style="font-size:16px;font-weight:800;color:var(--text)">${y}년 ${mn[m]}</span>
  </div>
</header>
<div class="screen">
  <div class="cal-wrap" id="cal-wrap"
    ontouchstart="calTouchStart(event)"
    ontouchend="calTouchEnd(event)">
    <div class="cal-weekdays">${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-wd">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    ${popup}
  </div>
</div>
<button class="fab" ${fabGetStyle()} ontouchstart="fabDown(event,'openAdd')" onmousedown="fabDown(event,'openAdd')">+</button>`;
}


function buildStatsView(){
  const scored=S.items.filter(i=>i.earnedScore!==null&&i.earnedScore!=='');
  const avg=scored.length>0?Math.round(scored.reduce((a,i)=>a+(i.earnedScore/i.maxScore*100),0)/scored.length):null;
  const tot=S.items.reduce((a,i)=>a+i.tasks.length,0);
  const dn=S.items.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
  const cr=tot>0?Math.round(dn/tot*100):0;

  // 과목별 점수율
  const scoreChart=scored.length===0
    ?`<div class="no-data">📊 점수가 입력된 수행평가가 없어요</div>`
    :scored.map(item=>{
      const p=Math.round(item.earnedScore/item.maxScore*100);
      const sc=getColor(item.subject);
      return`<div class="score-bar-row"><div class="score-bar-label">${esc(item.subject)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${p}%;background:${sc.accent}">${p}%</div></div><div class="score-bar-val">${item.earnedScore}/${item.maxScore}</div></div>`;
    }).join('');

  // 완료율 추이
  const hist=S.trend.slice(-14);
  let trendChart;
  if(hist.length<2){
    trendChart=`<div class="no-data">📈 데이터 수집 중이에요<br><small style="color:#BBB">체크리스트를 체크하면 기록됩니다</small></div>`;
  }else{
    const W=300,H=100,P=8;
    const pts=hist.map((h,i)=>({x:P+(i/(hist.length-1))*(W-P*2),y:H-P-(h.pct/100)*(H-P*2),pct:h.pct,date:h.date}));
    const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const area=`M${pts[0].x.toFixed(1)},${H} ${pts.map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} L${pts[pts.length-1].x.toFixed(1)},${H} Z`;
    const labs=pts.filter((_,i)=>i===0||i===pts.length-1||i===Math.floor(pts.length/2));
    trendChart=`<svg viewBox="0 0 ${W} ${H+20}" class="chart-svg" style="height:${H+20}px"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5B7FFF" stop-opacity=".3"/><stop offset="100%" stop-color="#5B7FFF" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#tg)"/><polyline points="${poly}" fill="none" stroke="#5B7FFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#5B7FFF"/><text x="${p.x.toFixed(1)}" y="${(p.y-7).toFixed(1)}" text-anchor="middle" font-size="9" fill="#5B7FFF" font-weight="700">${p.pct}%</text>`).join('')}${labs.map(p=>`<text x="${p.x.toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="9" fill="#AAA">${p.date.slice(5)}</text>`).join('')}</svg>`;
  }

  // 과목별 진행률
  const subjComp=SUBJECTS.map(sub=>{
    const si=S.items.filter(i=>i.subject===sub.name);
    if(!si.length)return null;
    const t=si.reduce((a,i)=>a+i.tasks.length,0);
    const d=si.reduce((a,i)=>a+i.tasks.filter(t=>t.done).length,0);
    return{name:sub.name,pct:t>0?Math.round(d/t*100):0,accent:sub.accent,count:si.length};
  }).filter(Boolean);

  return`
<header><div class="hd-row" style="margin-bottom:12px"><div><div class="hd-sub">📊 분석</div><div class="hd-title">수행평가 통계</div></div><div class="hd-right">${syncBadge()}</div></div></header>
<div class="screen">
  <div class="summary-grid" style="margin-bottom:14px">
    <div class="sum-card"><div class="sum-val" style="color:var(--p)">${S.items.length}</div><div class="sum-lbl">전체</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--ok)">${cr}%</div><div class="sum-lbl">전체 완료율</div></div>
    <div class="sum-card"><div class="sum-val" style="color:#FF9800">${avg!==null?avg+'%':'--'}</div><div class="sum-lbl">평균 점수율</div></div>
    <div class="sum-card"><div class="sum-val" style="color:var(--danger)">${S.items.filter(i=>{const d=getDays(i.dueDate);return d!==null&&d<=3&&d>=0}).length}</div><div class="sum-lbl">마감임박 3일</div></div>
  </div>
  ${subjComp.length>0?`<div class="stat-section"><div class="stat-section-title">📚 과목별 진행률</div>${subjComp.map(sc=>`<div class="score-bar-row"><div class="score-bar-label">${esc(sc.name)}</div><div class="score-bar-track"><div class="score-bar-fill" style="width:${sc.pct}%;background:${sc.accent}">${sc.pct}%</div></div><div class="score-bar-val" style="color:${sc.accent}">${sc.count}개</div></div>`).join('')}</div>`:''}
  <div class="stat-section"><div class="stat-section-title">🏆 과목별 점수율</div>${scoreChart}</div>
  <div class="stat-section"><div class="stat-section-title">📈 완료율 추이</div>${trendChart}</div>
</div>`;
}

function openEvtDetail(id){S.evtOverlay='detail';S.activeEvtId=id;renderEvtOverlay();}
function openEvtAdd(){
  S.evtForm={title:'',startDate:todayStr(),endDate:todayStr(),allDay:true,startTime:'',endTime:'',category:'일반',person:'',color:'#FF6B8A',memo:''};
  S.evtOverlay='form';renderEvtOverlay();
}
function openEvtEdit(id){
  const ev=S.events.find(e=>e.id===id);if(!ev)return;
  S.evtForm={...ev,startDate:ev.startDate||ev.date,endDate:ev.endDate||ev.startDate||ev.date};S.evtOverlay='form';renderEvtOverlay();
}
function closeEvtOverlay(){
  const ov=document.getElementById('evt-ov');
  if(ov){ov.classList.remove('open');setTimeout(()=>{S.evtOverlay=null;S.activeEvtId=null;S.evtForm=null;const el=document.getElementById('evt-ov');if(el)el.remove();},280);}
  else{S.evtOverlay=null;S.activeEvtId=null;S.evtForm=null;}
}
function renderEvtOverlay(){
  let old=document.getElementById('evt-ov');if(old)old.remove();
  if(!S.evtOverlay)return;
  const div=document.createElement('div');div.className='overlay';div.id='evt-ov';
  div.onclick=e=>{if(e.target===div)closeEvtOverlay();};
  let inner='';
  if(S.evtOverlay==='detail'){const ev=S.events.find(e=>e.id===S.activeEvtId);if(ev)inner=buildEvtDetailSheet(ev);}
  else if(S.evtOverlay==='form')inner=buildEvtFormSheet();
  div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${inner}</div>`;
  document.body.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('open')));
}
function togEvtAllday(checked){
  S.evtForm.allDay=checked;
  const row=document.getElementById('ef-time-row');if(row)row.style.display=checked?'none':'flex';
}
function setEvtCat(cat){
  S.evtForm.category=cat;
  document.querySelectorAll('#ef-cats > div').forEach(d=>{
    const c=EVT_CATS.find(x=>x[1]===cat);
    const isSel=d.textContent.includes(cat);
    d.style.borderColor=isSel?(c?c[2]:'var(--p)'):'#DDD';
    d.style.background=isSel?(c?c[2]+'22':'var(--p-light)'):'#fff';
    d.style.color=isSel?(c?c[2]:'var(--p)'):'#888';
  });
}
function setEvtColor(c){
  S.evtForm.color=c;
  const sb=document.getElementById('ef-save');if(sb)sb.style.background=c;
  document.querySelectorAll('#ef-save').forEach(b=>b.style.background=c);
  // dot border 업데이트
  renderEvtOverlay();
}
function saveEvtForm(){
  const title=document.getElementById('ef-title')?.value?.trim();
  const startDate=document.getElementById('ef-start-date')?.value;
  const endDate=document.getElementById('ef-end-date')?.value||startDate;
  if(!title){alert('제목을 입력하세요.');return;}
  if(!startDate){alert('시작일을 선택하세요.');return;}
  if(endDate&&endDate<startDate){alert('종료일은 시작일 이후여야 합니다.');return;}
  const allDay=document.getElementById('ef-allday')?.checked!==false;
  const ev={
    id:S.evtForm.id||uid(),
    title,
    startDate,endDate:endDate||startDate,
    date:startDate,
    allDay,
    startTime:allDay?'':(document.getElementById('ef-start')?.value||''),
    endTime:allDay?'':(document.getElementById('ef-end')?.value||''),
    category:S.evtForm.category||'일반',
    person:document.getElementById('ef-person')?.value?.trim()||'',
    color:S.evtForm.color||'#FF6B8A',
    memo:document.getElementById('ef-memo')?.value?.trim()||'',
    createdAt:S.evtForm.createdAt||Date.now(),
  };
  if(S.evtForm.id) S.events=S.events.map(e=>e.id===S.evtForm.id?ev:e);
  else S.events=[ev,...S.events];
  closeEvtOverlay();
  render();
  saveEventFS(ev);
}
function deleteEvt(id){
  if(!confirm('일정을 삭제할까요?'))return;
  S.events=S.events.filter(e=>e.id!==id);
  closeEvtOverlay();render();
  deleteEventFS(id);
}

function openGuideDetail(subjectId, taskIdx){
  GS.subjectId=subjectId; GS.taskIdx=taskIdx;
  renderGuideSheet();
}

function renderGuideSheet(){
  let old=document.getElementById('guide-ov');if(old)old.remove();
  const div=document.createElement('div');div.className='overlay';div.id='guide-ov';
  div.onclick=e=>{if(e.target===div)closeGuideSheet()};
  if(GS.subjectId==='common'){
    div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${buildCommonGuide()}</div>`;
  } else {
    const sub=GUIDE_SUBJECTS.find(s=>s.id===GS.subjectId);
    if(!sub)return;
    div.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${buildSubjectGuide(sub)}</div>`;
  }
  document.body.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('open')));
}

function closeGuideSheet(){
  const ov=document.getElementById('guide-ov');
  if(ov){ov.classList.remove('open');setTimeout(()=>ov.remove(),280);}
}

  return`<div class="drag-handle"></div>

<div class="prog-lg-hd"><span style="font-size:12px;font-weight:700;color:#555">완료율</span><span style="font-size:13px;font-weight:900;color:${sc.accent}">${p}%</span></div>
<div class="prog-lg-wrap"><div class="prog-lg-bar" style="width:${p}%;background:${sc.accent}"></div></div>
<div class="det-sec">수행 내용</div>
<div class="task-list">
  ${item.tasks.length===0?'<p style="font-size:12px;color:#AAA">등록된 내용이 없습니다.</p>':''}

  <span style="font-size:13px;color:#555;font-weight:600"> / ${item.maxScore}점</span>

  const item=S.items.find(i=>i.id===itemId);if(!item)return;

  if(removing?.type==='img'){

    const localImgs=newAtts.filter(a=>a.type==='img');

document.getElementById('attach-file').addEventListener('change',async e=>{
  const id=S.attachTargetId;if(!id)return;
  const files=Array.from(e.target.files);
  const item=S.items.find(i=>i.id===id);if(!item)return;
  const newAtts=[];
  for(const file of files){
    if(file.type.startsWith('image/')){
      const data=await compressImg(file,600,600,.75);
      newAtts.push({id:uid(),type:'img',name:file.name,data});
    } else {
      const text=await file.text();
      newAtts.push({id:uid(),type:'txt',name:file.name,data:text.slice(0,500)});
    }
  }
  const allAtts=[...(item.attachments||[]),...newAtts];
  const localImgs=allAtts.filter(a=>a.type==='img');
  localStorage.setItem('img_'+id,JSON.stringify(localImgs)); // 이미지는 로컬에만
  const updated={...item,attachments:allAtts};
  S.items=S.items.map(i=>i.id!==id?i:updated);
  setState({overlay:'detail',activeId:id});
  saveItemFS(updated); // 텍스트 첨부만 Firestore에
  e.target.value='';
});
function compressImg(file,mw,mh,q){
  return new Promise(res=>{
    const c=document.createElement('canvas'),img=new Image();
    img.onload=()=>{let w=img.width,h=img.height;if(w>mw){h=h*mw/w;w=mw}if(h>mh){w=w*mh/h;h=mh}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};
    img.src=URL.createObjectURL(file);
  });
}

function saveForm(){
  const subj=document.getElementById('f-subj')?.value?.trim();
  const date=document.getElementById('f-date')?.value;
  const score=document.getElementById('f-score')?.value;
  const memo=document.getElementById('f-memo')?.value||'';
  const alarmDays=Number(document.getElementById('f-alarm-days')?.value||3);
  if(!subj){alert('과목을 입력하세요.');return}
  if(!date){alert('제출일을 입력하세요.');return}
  const clean=S.form.tasks.filter(t=>t.text.trim());
  if(!clean.length){alert('수행 내용을 하나 이상 입력하세요.');return}
  const existing=S.form.id?S.items.find(i=>i.id===S.form.id):null;
  const newItem={
    id:S.form.id||uid(),subject:subj,dueDate:date,tasks:clean,
    maxScore:Number(score)||20,earnedScore:existing?.earnedScore??null,
    alarmDaysBefore:alarmDays,alarmEnabled:S.form.alarmEnabled,memo,
    priority:S.form.priority||2,
    attachments:existing?.attachments||[],
    createdAt:existing?.createdAt||Date.now(),
  };
  // 낙관적 업데이트
  if(S.form.id) S.items=S.items.map(i=>i.id===S.form.id?newItem:i);
  else S.items=[newItem,...S.items];
  setState({overlay:null,activeId:null,form:null});
  saveItemFS(newItem); // Firestore에 저장
}

function _saveFP(x,y){_FP={x,y};localStorage.setItem('fabpos',JSON.stringify(_FP));}
function fabGetStyle(extra){
  let st=_FP?'left:'+_FP.x+'px;top:'+_FP.y+'px;right:auto;bottom:auto;':'';
  if(extra)st+=extra;
  return st?'style="'+st+'"':'';
}
function fabDown(e,act){
  e.stopPropagation();
  if(e.cancelable)e.preventDefault();
  const el=e.currentTarget;
  const pt=e.touches?e.touches[0]:e;
  const sx=pt.clientX,sy=pt.clientY;
  const rect=el.getBoundingClientRect();
  const ox=sx-rect.left,oy=sy-rect.top;
  let drag=false;
  // 길게 누르기 감지 (480ms)
  const tm=setTimeout(()=>{
    drag=true;
    el.style.opacity='.75';
    el.style.transform='scale(1.15)';
    el.style.transition='none';
    el.style.zIndex='999';
    // 진동 피드백 (지원 기기)
    if(navigator.vibrate)navigator.vibrate(30);
  },480);
  function mv(ev){
    const p=ev.touches?ev.touches[0]:ev;
    if(!drag){
      if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10)clearTimeout(tm);
      return;
    }
    if(ev.cancelable)ev.preventDefault();
    el.style.left=(p.clientX-ox)+'px';
    el.style.top=(p.clientY-oy)+'px';
    el.style.right='auto';
    el.style.bottom='auto';
  }
  function up(){
    clearTimeout(tm);
    document.removeEventListener('touchmove',mv,{passive:false});
    document.removeEventListener('touchend',up);
    document.removeEventListener('mousemove',mv);
    document.removeEventListener('mouseup',up);
    if(drag){
      el.style.opacity='1';
      el.style.transform='scale(1)';
      el.style.transition='transform .15s';
      setTimeout(()=>el.style.transition='',200);
      const nr=el.getBoundingClientRect();
      // 화면 경계 안으로 제한
      const nx=Math.max(10,Math.min(window.innerWidth-62,nr.left));
      const ny=Math.max(10,Math.min(window.innerHeight-66,nr.top));
      el.style.left=nx+'px';
      el.style.top=ny+'px';
      _saveFP(nx,ny);
    }else{
      el.style.opacity='1';
      el.style.transform='';
      window[act]();
    }
  }
  document.addEventListener('touchmove',mv,{passive:false});
  document.addEventListener('touchend',up);
  document.addEventListener('mousemove',mv);
  document.addEventListener('mouseup',up);
}

  }

  }
});
